<!DOCTYPE html>
<html lang="zh-CN" data-theme="{{THEME}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NC 数据字典</title>
<style>
:root{
  --brand:#1E6FFF; --brand-dark:#0A4FD0; --brand-deep:#083A99;
  --brand-light:#EAF2FF; --brand-lighter:#F5F8FF;
  --teal:#0EA5A4;
  --ink:#1F2329; --ink-2:#35414F; --muted:#667085; --muted-2:#98A2B3;
  --line:#E6EBF2; --line-2:#EEF2F8;
  --card:#FFFFFF; --bg:#F4F7FC;
  --ok:#12B76A; --err:#E5484D; --amber:#B45309; --amber-bg:#FFF7ED;
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  --shadow-md:0 6px 24px -8px rgba(16,24,40,.14),0 2px 6px -2px rgba(16,24,40,.05);
  --shadow-lg:0 20px 50px -12px rgba(10,79,208,.22),0 8px 20px -8px rgba(16,24,40,.08);
  --radius:14px; --radius-sm:10px;
  --mono:"SFMono-Regular",Consolas,"Cascadia Mono","Liberation Mono",Menlo,monospace;
  --hd-grad:linear-gradient(135deg,#073A99 0%,#0A4FD0 46%,#1E6FFF 78%,#13a8d8 110%);
}
/* ============ 主题 ============ */
/* 极简浅色（Minimal Light） */
html[data-theme="min-light"]{
  --brand:#2563EB; --brand-dark:#1E40AF; --brand-deep:#1E3A8A;
  --brand-light:#EFF6FF; --brand-lighter:#F8FAFC;
  --teal:#0D9488;
  --ink:#111827; --ink-2:#374151; --muted:#6B7280; --muted-2:#9CA3AF;
  --line:#E5E7EB; --line-2:#F1F3F5;
  --card:#FFFFFF; --bg:#F8FAFC;
  --ok:#10B981; --err:#DC2626; --amber:#B45309; --amber-bg:#FFFBEB;
  --hd-grad:linear-gradient(135deg,#1E3A8A 0%,#2563EB 60%,#60A5FA 110%);
}
/* 暗色（Dark） */
html[data-theme="dark"]{
  --brand:#4C9AFF; --brand-dark:#82B1FF; --brand-deep:#6CA0FF;
  --brand-light:#1B2A4A; --brand-lighter:#16213A;
  --teal:#2DD4BF;
  --ink:#E6EAF2; --ink-2:#C9D2E0; --muted:#94A3B8; --muted-2:#64748B;
  --line:#2B3446; --line-2:#232B3B;
  --card:#1C2436; --bg:#0F1522;
  --ok:#34D399; --err:#F87171; --amber:#F59E0B; --amber-bg:#3B2E1A;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 6px 24px -8px rgba(0,0,0,.5),0 2px 6px -2px rgba(0,0,0,.35);
  --shadow-lg:0 20px 50px -12px rgba(0,0,0,.6),0 8px 20px -8px rgba(0,0,0,.4);
  --hd-grad:linear-gradient(135deg,#0B1220 0%,#16213A 50%,#1E3A6E 100%);
}
/* 青绿（Teal） */
html[data-theme="teal"]{
  --brand:#0E9F8A; --brand-dark:#0B7E6E; --brand-deep:#096052;
  --brand-light:#E6F7F3; --brand-lighter:#F0FAF7;
  --teal:#0EA5A4;
  --ink:#1F2A28; --ink-2:#33413E; --muted:#5C6B67; --muted-2:#8CA099;
  --line:#DCEAE4; --line-2:#EBF3EF;
  --card:#FFFFFF; --bg:#F2F8F5;
  --ok:#0FAE7C; --err:#D64545; --amber:#A16207; --amber-bg:#FEF6E9;
  --hd-grad:linear-gradient(135deg,#065f52 0%,#0B7E6E 50%,#0E9F8A 85%,#22c3a8 110%);
}
/* ============ 主题（作用于硬编码亮色表面） ============ */
html[data-theme="dark"] body{color:var(--ink)}
html[data-theme="dark"] header{background:var(--hd-grad)}
html[data-theme="dark"] .toolbar{background:rgba(15,21,34,.92);border-bottom-color:#2B3446}
html[data-theme="dark"] .tab-body{background:#131a2a}
html[data-theme="dark"] .tab-bar{background:#1C2436}
html[data-theme="dark"] .comphead{background:linear-gradient(180deg,#1C2436,var(--brand-lighter))}
html[data-theme="dark"] .entity{background:#151d2e}
html[data-theme="dark"] .ehead{background:#182135;border-bottom-color:#2B3446}
html[data-theme="dark"] table.grid th{background:linear-gradient(180deg,#1d2740,#18213a);color:var(--ink-2)}
html[data-theme="dark"] table.grid tbody tr:hover td{background:#1b2538}
html[data-theme="dark"] table.grid tbody tr.pk-row td{background:#2a1f24}
html[data-theme="dark"] table.grid tbody tr.pk-row:hover td{background:#332328}
html[data-theme="dark"] #searchResults{background:#1C2436}
html[data-theme="dark"] #drawer{background:#1C2436}
html[data-theme="dark"] #navResult .nf-mod{color:var(--brand-deep)}
html[data-theme="dark"] .searchwrap input,.pager button,.pager select,.navsearch input{background:#151d2e;color:var(--ink)}
html[data-theme="dark"] button.ui.ghost{border-color:#35466a}
html[data-theme="dark"] footer .footline{background:#1C2436}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:120px}
body{font-family:"Segoe UI","Microsoft YaHei",-apple-system,"PingFang SC",sans-serif;color:var(--ink);background:var(--bg);line-height:1.55;-webkit-font-smoothing:antialiased}

/* ---------- Header ---------- */
header{position:relative;color:#fff;overflow:hidden;
  background:var(--hd-grad)}
header::after{content:"";position:absolute;inset:0;
  background:
    radial-gradient(600px 300px at 85% -20%,rgba(255,255,255,.18),transparent 60%),
    radial-gradient(500px 260px at 8% 120%,rgba(255,255,255,.10),transparent 55%);
  pointer-events:none}
.hd-inner{max-width:1500px;margin:0 auto;padding:13px 26px;position:relative;z-index:1}
.hd-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.34);font-size:16px;font-weight:800;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25);flex-shrink:0}
.hd-titles h1{font-size:17px;font-weight:800;letter-spacing:.5px;display:flex;align-items:center;gap:9px}
.hd-titles h1 .ver-tag{font-size:11px;font-weight:600;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);
  border-radius:999px;padding:1px 9px}
.hd-titles h1 .turmo{font-size:10.5px;font-weight:500;opacity:.75;letter-spacing:.5px;color:#fff}
.hd-titles .sub{font-size:11.5px;opacity:.92;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;position:relative;z-index:1}
.chip{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.26);border-radius:999px;
  padding:2px 10px;font-size:11.5px;display:inline-flex;align-items:center;gap:5px;backdrop-filter:blur(2px)}
.chip b{font-weight:700}
.chip .dot{width:6px;height:6px;border-radius:50%;background:#7ef0c2;box-shadow:0 0 6px #7ef0c2}

/* ---------- Toolbar ---------- */
.toolbar{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);box-shadow:var(--shadow-sm);padding:11px 24px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.toolbar .grow{flex:1;min-width:220px}
.searchwrap{position:relative}
.searchwrap .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted-2);font-size:15px;pointer-events:none}
.searchwrap .kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted-2);
  background:var(--line-2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-family:var(--mono)}
.searchwrap input{width:100%;padding:9px 44px 9px 38px;border:1.5px solid var(--line);border-radius:var(--radius-sm);
  font-size:14px;outline:none;transition:.18s;background:#fff}
.searchwrap input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(30,111,255,.12)}
.searchwrap input::placeholder{color:var(--muted-2)}
.stats{font-size:13px;color:var(--muted);white-space:nowrap}
.stats b{color:var(--brand-dark)}
/* ---------- Pager ---------- */
.pager{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pager .pg{font-size:12px;color:var(--muted);font-weight:600;min-width:52px;text-align:center}
.pager button{width:28px;height:28px;border:1px solid var(--line);background:#fff;color:var(--ink-2);border-radius:8px;
  cursor:pointer;font-size:13px;line-height:1;transition:.15s;padding:0}
.pager button:hover:not(:disabled){border-color:var(--brand);color:var(--brand-dark);background:var(--brand-light)}
.pager button:disabled{opacity:.35;cursor:default}
.pager select{border:1px solid var(--line);border-radius:8px;font-size:12px;padding:4px 6px;background:#fff;color:var(--ink-2);cursor:pointer;outline:none}
.pager select:focus{border-color:var(--brand)}
button.ui{border:none;border-radius:var(--radius-sm);padding:9px 14px;cursor:pointer;font-size:13px;font-weight:600;
  transition:.16s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
button.ui:hover{transform:translateY(-1px)}
button.ui:active{transform:translateY(0)}
button.ui.ghost{background:var(--brand-light);color:var(--brand-dark);border:1px solid #c7d8ff}
button.ui.ghost:hover{background:#dde9ff}
button.ui.plain{background:#fff;color:var(--ink-2);border:1px solid var(--line)}
button.ui.plain:hover{border-color:var(--brand);color:var(--brand-dark)}
button.ui.primary{background:linear-gradient(135deg,var(--brand),var(--brand-dark));color:#fff;box-shadow:0 2px 8px rgba(10,79,208,.28)}
button.ui.primary:hover{box-shadow:0 4px 14px rgba(10,79,208,.36)}
button.ui.accent{background:var(--teal);color:#fff;border:1px solid #0b7e7e} 
#resCount{font-size:12px;color:var(--brand-dark);background:var(--brand-light);border-radius:999px;padding:2px 10px;display:none}
#resCount.show{display:inline-flex;align-items:center;gap:4px}

/* ---------- Layout ---------- */
main{display:flex;gap:20px;padding:22px 24px 40px;max-width:1500px;margin:0 auto}
aside{width:308px;flex-shrink:0}
.navcard{position:sticky;top:84px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow-sm);display:flex;flex-direction:column;max-height:calc(100vh - 130px);overflow:hidden}
.ntitle{font-weight:800;font-size:13.5px;color:var(--brand-deep);padding:14px 16px 12px;border-bottom:1px solid var(--line-2);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.ntitle .mini{font-weight:600;color:var(--muted-2);font-size:12px}
.navsearch{padding:10px 12px;border-bottom:1px solid var(--line-2);flex-shrink:0}
.navsearch input{width:100%;padding:7px 11px;border:1.5px solid var(--line);border-radius:9px;font-size:12.5px;outline:none;transition:.15s}
.navsearch input:focus{border-color:var(--brand)}
.navtree{overflow:auto;padding:8px;flex:1}
.navtree ul{list-style:none}
.navtree li.mod{margin:2px 0}
.navtree .mt{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:9px;cursor:pointer;user-select:none;transition:.12s}
.navtree .mt:hover{background:var(--brand-lighter)}
.navtree .mt .chester{width:9px;height:9px;flex-shrink:0;transition:transform .18s;color:var(--muted-2)}
.navtree li.mod.open .chester{transform:rotate(90deg)}
.navtree .mt .tname{font-weight:700;font-size:13px;color:var(--ink);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navtree .mt .tcnt{font-size:11px;color:var(--muted-2);background:var(--line-2);border-radius:999px;padding:1px 8px}
.navtree ul.comps{display:none;padding-left:10px}
.navtree li.mod.open > ul.comps{display:block}
.navtree li.comp{margin:1px 0}
.navtree .ct{display:flex;align-items:center;gap:6px;padding:6px 9px;border-radius:8px;cursor:pointer;user-select:none;font-size:12.5px;transition:.12s}
.navtree .ct:hover{background:var(--brand-lighter)}
.navtree .ct .cname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navtree .ct.active{background:var(--brand-light);color:var(--brand-dark);font-weight:600}
.navtree .ct .ecnt{font-size:11px;color:var(--muted-2)}
.navtree .ct .chester{width:9px;height:9px;flex-shrink:0;transition:transform .18s;color:var(--muted-2)}
.navtree li.comp.open > .chester,.navtree .ct .chev{transition:transform .15s}
.navtree .ct .chev.down{transform:rotate(90deg)}
.navtree ul.clss{display:none;padding-left:8px}
.navtree li.comp.open > ul.clss{display:block}
.navtree li.cls{margin:1px 0}
.navtree .cl{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:7px;cursor:pointer;font-size:12px;color:var(--ink-2);transition:.12s}
.navtree .cl:hover{background:var(--brand-lighter);color:var(--brand-dark)}
.navtree .cl.active{background:linear-gradient(135deg,var(--brand-light),#eef4ff);color:var(--brand-dark);font-weight:600}
.navtree .cl .d{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.navtree .cl .pk{color:var(--err);font-weight:700}
.navtree .nav-empty{padding:24px 12px;text-align:center;color:var(--muted-2);font-size:12.5px}

article{flex:1;min-width:0;display:flex;flex-direction:column;gap:20px}
#content{display:flex;flex-direction:column;gap:20px}
section.mod{scroll-margin-top:90px}
.modtitle{display:flex;align-items:center;gap:12px;padding:6px 4px 0}
.modtitle .nm{font-size:19px;font-weight:800;color:var(--ink)}
.modtitle .nm .en{font-size:12.5px;font-weight:600;color:var(--muted-2);margin-left:8px}
.modtitle .cnt{font-size:12px;color:var(--brand-dark);background:var(--brand-light);padding:3px 12px;border-radius:999px;font-weight:600}
.comps{display:flex;flex-direction:column;gap:16px;margin-top:12px}
.compcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden;transition:box-shadow .2s}
.compcard:hover{box-shadow:var(--shadow-md)}
.comphead{padding:14px 18px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;justify-content:space-between;gap:12px;
  cursor:pointer;user-select:none;background:linear-gradient(180deg,#fff,var(--brand-lighter))}
.comphead .cn{font-size:16px;font-weight:800;color:var(--brand-deep)}
.comphead .cn .en{font-weight:500;color:var(--muted-2);font-size:12.5px;margin-left:8px;font-family:var(--mono)}
.compmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.compmeta .mtag{font-size:11.5px;border-radius:6px;padding:2px 9px;display:inline-flex;align-items:center;gap:4px;border:1px solid transparent}
.mtag.bill{background:#1E6FFF14;color:var(--brand-dark);border-color:#c9dcff}
.mtag.node{background:#eef2ff;color:#3730a3;border-color:#c7d2fe}
.mtag.bean{background:var(--amber-bg);color:var(--amber);border-color:#fed7aa}
.compadjust{color:var(--muted-2);font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.entwrap{padding:6px 18px 18px}
.entity{margin-top:14px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;transition:border-color .15s}
.entity:target{border-color:var(--brand);box-shadow:0 0 0 3px rgba(30,111,255,.12)}
.ehead{display:flex;align-items:center;gap:10px;padding:11px 16px;background:#fafcff;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.ehead .dn{font-size:16px;font-weight:800;color:var(--ink)}
.ehead .dn .en{font-weight:500;color:var(--muted-2);font-size:12px;margin-left:7px;font-family:var(--mono)}
.ki{font-size:11px;font-weight:700;border-radius:6px;padding:2px 8px}
.ki.pk{background:linear-gradient(135deg,var(--err),#ef6f74);color:#fff}
.ki.tbl{background:#e0f2fe;color:#0369a1}
.tchip.func{background:#f0f4ff;color:#3f3f9f;border-color:#c8d0f0}
.klass{font-size:11.5px;color:var(--muted-2);font-family:var(--mono);margin-left:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46%;cursor:default}
.klass .full{display:none}
table.grid{width:100%;border-collapse:collapse;font-size:14px}
table.grid th{background:linear-gradient(180deg,#f5f8fd,#eef3fb);color:var(--ink-2);text-align:left;padding:9px 12px;font-size:13px;
  border-bottom:1px solid var(--line);white-space:nowrap;font-weight:700}
table.grid td{padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:top;word-break:break-word}
table.grid tbody tr{transition:background .1s}
table.grid tbody tr:last-child td{border-bottom:none}
table.grid tbody tr:hover td{background:#f6f9ff}
table.grid tbody tr.pk-row td{background:#fff7f8}
table.grid tbody tr.pk-row:hover td{background:#fff0f1}
.mono{font-family:var(--mono);font-size:12px}
.pkstar{color:var(--err);font-weight:800}
.tbadge{display:inline-block;font-size:11px;font-weight:600;border-radius:6px;padding:1px 7px;margin-right:4px;
  background:var(--brand-light);color:var(--brand-dark);border:1px solid #d3e2ff;font-family:var(--mono)}
.tbadge.str{background:#e9f9f0;color:#0e7a4e;border-color:#c2ecd6}
.tbadge.num{background:#eef2ff;color:#4a4fbf;border-color:#ced6fb}
.tbadge.date{background:#fff7ed;color:var(--amber);border-color:#fed7aa}
.tbadge.blob{background:#f5f3ff;color:#6d28d9;border-color:#e0d7f9}
.tbadge.bool{background:#f0fdfa;color:#0f766e;border-color:#bbf7d0}
.null-flag{font-size:11px;color:var(--muted-2);background:var(--line-2);border-radius:5px;padding:1px 6px}
col.th-col{width:170px}
.enumbox{margin-top:5px;border-left:3px solid var(--brand);background:var(--brand-lighter);border-radius:0 8px 8px 0;padding:5px 10px;
  display:flex;flex-wrap:wrap;gap:3px 12px;font-size:12px}
.enumbox .e{color:var(--brand-dark);font-weight:700;font-family:var(--mono)}
.enumbox .enm{color:var(--ink-2)}
.ref-link{color:var(--brand-dark);text-decoration:none;font-weight:600;border-bottom:1px dashed #9dc0ff;cursor:pointer}
.ref-link:hover{color:var(--brand);border-bottom-style:solid;background:var(--brand-lighter);border-radius:3px}
.ref-link:active{color:var(--brand-deep)}

/* search highlight */
mark.hit{background:#fff3a6;color:#6d5700;padding:0;border-radius:2px}
.empty{padding:36px;text-align:center;color:var(--muted-2)}
.dim{opacity:.45 !important}
.hidden{display:none !important}

/* global search results dropdown */
#searchResults{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--shadow-md);z-index:80;max-height:52vh;overflow:auto;display:none}
#searchResults.show{display:block}
#searchResults .searchwrap{position:relative}
#q,#navQ,#searchResults{width:100%}
.sr-list{list-style:none}
.sr-item{display:flex;align-items:center;gap:8px;padding:9px 14px;cursor:pointer;border-bottom:1px solid var(--line-2);font-size:13px;transition:.1s}
.sr-item:hover{background:var(--brand-lighter)}
.sr-item:last-child{border-bottom:none}
.sr-pk{color:var(--err);width:10px;flex-shrink:0}
.sr-main{font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-en{font-family:var(--mono);font-size:11.5px;color:var(--muted-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:16ch}
.sr-tbl{font-size:11px;background:var(--brand-light);color:var(--brand-dark);border-radius:5px;padding:1px 7px;white-space:nowrap}
.sr-go{margin-left:auto;font-size:12px;color:var(--brand-dark);font-weight:600;flex-shrink:0}
.sr-empty{padding:26px;text-align:center;color:var(--muted-2);font-size:13px}
.sr-item.sr-more{color:var(--muted-2);cursor:default;font-size:12px}

/* empty greeting */
.empty.greet{padding:90px 40px;display:flex;flex-direction:column;align-items:center;gap:14px}
.empty.greet .g-ico{font-size:46px}
.empty.greet p{color:var(--muted);font-size:14px}

/* nav filter results */
#navResult{overflow:auto;padding:8px;flex:1}
#navResult .navfilter-block{list-style:none;margin:4px 0}
#navResult .nf-mod{font-weight:800;font-size:13px;color:var(--brand-deep);padding:7px 9px}
#navResult .nf-mod .nf-hit{font-size:10.5px;color:var(--ok);background:#e9f9f0;border-radius:99px;padding:1px 7px;margin-left:6px}
#navResult .nf-comp{font-size:12.5px;color:var(--ink-2);padding:6px 12px;cursor:default}
#navResult .nf-comp>ul{list-style:none;padding-left:10px}
#navResult .nf-cl{font-size:12px;color:var(--ink-2);padding:5px 10px;cursor:pointer;display:flex;gap:8px;align-items:center;border-radius:7px}
#navResult .nf-cl:hover{background:var(--brand-lighter);color:var(--brand-dark)}
#navResult .nf-cl .sr-main{font-weight:600}
#navResult .nf-cl .sr-tbl{font-size:10.5px}


/* toast */
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
  padding:10px 20px;border-radius:10px;font-size:13px;z-index:200;opacity:0;pointer-events:none;transition:.25s;box-shadow:var(--shadow-lg)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* back to top */
#toTop{position:fixed;right:26px;bottom:30px;width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;z-index:90;
  background:linear-gradient(135deg,var(--brand),var(--brand-dark));color:#fff;font-size:18px;box-shadow:var(--shadow-lg);
  opacity:0;visibility:hidden;transform:translateY(8px);transition:.25s}
#toTop.show{opacity:1;visibility:visible;transform:translateY(0)}
#toTop:hover{transform:translateY(-2px)}

/* settings drawer */
#drawer{position:fixed;top:0;left:0;bottom:0;width:340px;max-width:88vw;background:#fff;z-index:150;
  box-shadow:var(--shadow-lg);transform:translateX(-105%);transition:transform .28s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column}
#drawer.open{transform:translateX(0)}
#scrim{position:fixed;inset:0;background:rgba(16,24,40,.4);z-index:140;opacity:0;visibility:hidden;transition:.25s}
#scrim.show{opacity:1;visibility:visible}
.dr-head{padding:16px 18px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;justify-content:space-between}
.dr-head .t{font-weight:800;font-size:15px;color:var(--ink);display:flex;align-items:center;gap:8px}
.dr-close{border:none;background:none;font-size:20px;color:var(--muted-2);cursor:pointer;padding:4px}
.dr-close:hover{color:var(--ink)}
.dr-body{flex:1;overflow:auto;padding:14px 18px 30px}
.set-group{margin-bottom:20px}
.set-group .gt{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:10px}
.switch-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line-2)}
.switch-row:last-child{border-bottom:none}
.switch-row .lab{font-size:13px;color:var(--ink-2)}
.switch{position:relative;width:40px;height:22px;background:var(--line);border-radius:999px;cursor:pointer;transition:.2s;flex-shrink:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}
.switch.on{background:var(--brand)}
.switch.on::after{left:20px}
/* 主题选择 */
.theme-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.theme-opt{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 6px;border:2px solid var(--line);
  border-radius:12px;cursor:pointer;transition:.18s;background:var(--card)}
.theme-opt:hover{border-color:var(--brand)}
.theme-opt.active{border-color:var(--brand);box-shadow:0 0 0 3px rgba(30,111,255,.14)}
.theme-opt .sw{width:100%;height:44px;border-radius:9px;box-shadow:var(--shadow-sm)}
.theme-opt .tn{font-size:12.5px;color:var(--ink-2);font-weight:600}
html[data-theme="dark"] .theme-opt .sw{border:1px solid #35466a}
.theme-opt.active .tn{color:var(--brand-dark)}
.check-row{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:13px;color:var(--ink-2);cursor:pointer}
.check-row input{width:16px;height:16px;accent-color:var(--brand);cursor:pointer}
.dr-foot{padding:14px 18px;border-top:1px solid var(--line-2);display:flex;gap:10px}
.dr-foot button{flex:1}

/* tabs（随内容流，位于左目录右侧同一列，与导航对齐） */
#tabs{display:none;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow-sm);overflow:hidden}
#tabs.open{display:flex;flex-direction:column}
.tab-bar{display:flex;align-items:center;gap:4px;padding:8px 10px 0;border-bottom:1px solid var(--line-2);overflow-x:auto;flex-shrink:0;background:#fff}
.tab-bar::-webkit-scrollbar{height:6px}
.tab-item{display:inline-flex;align-items:center;gap:7px;padding:8px 9px 8px 13px;border-radius:10px 10px 0 0;cursor:pointer;
  font-size:12.5px;border:1px solid transparent;border-bottom:none;white-space:nowrap;flex-shrink:0;color:var(--ink-2)}
.tab-item:hover{background:var(--brand-lighter)}
.tab-item.active{background:var(--brand-light);color:var(--brand-dark);font-weight:700;border-color:#c9dcff}
.tab-item .x{border:none;background:none;color:var(--muted-2);cursor:pointer;font-size:16px;line-height:1;padding:0 3px;border-radius:50%}
.tab-item .x:hover{color:var(--err);background:#fff}
.tab-body{padding:16px;flex:1;background:#fafcff;overflow:visible}
.tab-close{margin-left:auto;padding:8px 10px;border:none;background:none;color:var(--muted-2);font-size:12px;cursor:pointer;flex-shrink:0}
.tab-close:hover{color:var(--err)}
.tab-inner{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tab-inner .tclass{font-size:16px;font-weight:800;color:var(--ink)}
.tab-inner .tsub{font-size:13px;color:var(--muted)}
.tab-inner .tchip{font-size:11.5px;border-radius:6px;padding:2px 8px;background:var(--brand-light);color:var(--brand-dark);border:1px solid #c9dcff}

footer{margin:10px auto 40px;text-align:center;color:var(--muted);font-size:12.5px;max-width:1500px;padding:0 24px}
footer .footline{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;box-shadow:var(--shadow-sm)}

@media (max-width:960px){
  main{padding:16px 14px 30px}
  aside{display:none}
  .hd-inner{padding:20px 18px}
  .toolbar{padding:10px 14px}
  .stats{display:none}
  #drawer{width:88vw}
}

@media print{
  header{background:var(--brand-deep)!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .toolbar,aside,#tabs,#drawer,#scrim,#toTop,#toast{display:none!important}
  body{background:#fff}
  main{display:block;padding:0}
  .compcard{break-inside:avoid;box-shadow:none}
  section.mod{break-inside:auto}
  .modtitle .nm{font-size:15px}
  .comphead{background:#f5f8fd!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>

<div id="scrim"></div>
<div id="drawer">
  <div class="dr-head"><span class="t">⚙ 易用性设置</span><button class="dr-close" id="drClose">✕</button></div>
  <div class="dr-body">
    <div class="set-group">

        <div class="theme-opt" data-theme="min-light" data-name="极简浅色"><span class="sw" style="background:linear-gradient(135deg,#E5E7EB,#F8FAFC);border:1px solid #D1D5DB"></span><span class="tn">极简浅色</span></div>
        <div class="theme-opt" data-theme="dark" data-name="暗色"><span class="sw" style="background:linear-gradient(135deg,#1C2436,#0F1522)"></span><span class="tn">暗色</span></div>
        <div class="theme-opt" data-theme="teal" data-name="青绿"><span class="sw" style="background:linear-gradient(135deg,#065f52,#0E9F8A)"></span><span class="tn">青绿</span></div>

<script>
window.agg = {{JSON}};
</script>
<script>
(function(){
  var agg = window.agg || {modules:[]};
  var $ = function(id){ return document.getElementById(id); };
  var nav = $('nav'), content = $('content');
  var inputQ = $('q'), navQ = $('navQ'), resCount = $('resCount');
  var drawer = $('drawer'), scrim = $('scrim');
  var tabs = $('tabs'), tabBar = $('tabBar'), tabBody = $('tabBody');
  var openTabs = [], activeTab = null, openTabKeys = {};

  /* ---------- helpers ---------- */
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function toast(msg){ var t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._tm); t._tm=setTimeout(function(){t.classList.remove('show');},1800); }
  function miOf(m){ return (agg.modules||[]).indexOf(m); }

  var colState = { name:true, dname:true, field:true, type:true, len:true, key:true, nullable:true, def:true, ref:true, desc:true };
  var prefs = { keyOnly:false, fullClass:false, theme:'{{THEME}}' };

  /* ---------- 主题 ---------- */
  function applyTheme(t){
    prefs.theme = t||'{{THEME}}';
    document.documentElement.setAttribute('data-theme', prefs.theme);
    var opts=document.querySelectorAll('#themeRow .theme-opt');
    for(var i=0;i<opts.length;i++){ opts[i].classList.toggle('active', opts[i].getAttribute('data-theme')===prefs.theme); }
  }

  function typeBadge(t){
    t = String(t||'').toLowerCase();
    var cls='num';
    if(/char|clob|text|string|varchar/.test(t)) cls='str';
    else if(/int|dec|num|double|float|long/.test(t)) cls='num';
    else if(/date|time/.test(t)) cls='date';
    else if(/blob|byte/.test(t)) cls='blob';
    else if(/bool/.test(t)) cls='bool';
    return cls;
  }
  function shortClass(fq){ if(!fq) return ''; var i=fq.lastIndexOf('.'); return i>=0?fq.slice(i+1):fq; }
  function classTypeName(t){ return {201:'实体',203:'枚举',206:'业务接口'}[t]||''; }
  /* 实体关联的功能/菜单/单据类型 chips */
  function funcChips(cl){
    var arr=(cl.funcs||[]); if(!arr.length){ return ''; }
    var out=[];
    arr.forEach(function(f){
      var parts=[];
      if(f.funcode) parts.push('功能 '+esc(f.funcode));
      if(f.menuitemname) parts.push('菜单 '+esc(f.menuitemname)+(f.menuitemcode?'('+esc(f.menuitemcode)+')':''));
      if(f.billtypename) parts.push('单据 '+esc(f.billtypename)
        +(f.billtypecode?' ['+esc(f.billtypecode)+']':''));
      if(parts.length){ out.push('<span class="tchip func" title="'+esc(parts.join(' · '))+'">'+parts.join(' · ')+'</span>'); }
    });
    return out.join('');
  }

  /* ---------- header info ---------- */
  $('ver').textContent = agg.ncVersion||'-';
  $('grp').textContent = agg.groupName||'-';
  $('dbh').textContent = agg.databaseName||'-';
  $('time').textContent = agg.generateTime||'-';
  $('remark').textContent = agg.remark||'NC 数据字典';
  document.title = (agg.remark||'NC 数据字典')+' · NC 数据字典 '+(agg.ncVersion||'');

  /* ---------- stats ---------- */
  var totalC=0,totalE=0,totalP=0;
  (agg.modules||[]).forEach(function(m){ totalC+=(m.comps||[]).length;
    (m.comps||[]).forEach(function(c){ totalE+=(c.classes||[]).length; totalP+=(c.classes||[]).reduce(function(s,x){return s+(x.props||[]).length;},0); }); });
  $('stM').textContent=(agg.modules||[]).length;
  $('stC').textContent=totalC; $('stE').textContent=totalE; $('stP').textContent=totalP;
  $('navMini').textContent = (agg.modules||[]).length+' 模块 · '+totalE+' 实体';

  /* ---------- 数据索引：按 class.id O(1) 查找 + 枚举值（refId -> 枚举值列表） ---------- */
  var classIndex = {};   // id -> cl
  var enumIndex = {};    // refId -> enumValues
  if(agg.modules){
    (agg.modules||[]).forEach(function(m){
      (m.comps||[]).forEach(function(c){
        (c.classes||[]).forEach(function(cl){ if(cl && cl.id){ classIndex[cl.id]=cl; } });
        (c.classes||[]).forEach(function(cl){
          (cl.props||[]).forEach(function(p){ if(p && p.refId && p.enumValues && p.enumValues.length && !enumIndex[p.refId]){ enumIndex[p.refId]=p.enumValues; } });
        });
      });
    });
  }
  function findClassById(id){ return classIndex[id] || null; }

  /* ---------- 表格列 / 行 ---------- */
  function enterHead(){ var h=[]; if(colState.name)h.push('属性编码'); if(colState.dname)h.push('属性名称'); if(colState.field)h.push('字段编码'); if(colState.type)h.push('数据类型'); if(colState.len)h.push('长度'); if(colState.key)h.push('主键'); if(colState.nullable)h.push('可空'); if(colState.def)h.push('默认值'); if(colState.ref)h.push('引用模型'); if(colState.desc)h.push('备注 / 枚举'); return h; }
  function enterRow(p){
    var cells=[];
    var td=function(html,mono){ cells.push(mono?'<td class="mono">'+html+'</td>':'<td>'+html+'</td>'); };
    if(colState.name) td(esc(p.name||''),true);
    if(colState.dname) td(esc(p.displayName||''));
    if(colState.field) td(esc(p.fieldType||''),true);
    if(colState.type){ var t=esc(p.typeName||'-'); if(p.enumValues&&p.enumValues.length){ var box=p.enumValues.map(function(ev){return '<span class="e">'+esc(ev.value)+'</span><span class="enm">='+esc(ev.name)+'</span>';}).join(''); t=t+'<div class="enumbox">'+box+'</div>'; } td('<span class="tbadge '+typeBadge(p.typeName)+'">'+t+'</span>'); }
    if(colState.len) td(esc(p.attrLength||''));
    if(colState.key) td(p.isKey?'<span class="pkstar">PK</span>':'-');
    if(colState.nullable) td(esc(p.nullable)&&String(p.nullable).toLowerCase()!=='false'&&String(p.nullable).toLowerCase()!=='no'&&String(p.nullable)!=='N'?( '<span class="null-flag">'+esc(p.nullable)+'</span>'):'否');
    if(colState.def) td(esc(p.defaultValue));
    if(colState.ref){ var r=esc(p.refDesc||''); if(p.refId && classIndex[p.refId]){ r='<a href="javascript:void(0)" class="ref-link" data-id="'+esc(p.refId)+'" title="点击查看引用实体字段">'+r+' &#9654;</a>'; } td(r); }
    if(colState.desc) td(esc(p.description));
    return cells.join('');
  }
  function makePropTable(cl){
    var table=document.createElement('table'); table.className='grid';
    var thead=document.createElement('thead'); thead.innerHTML='<tr>'+enterHead().map(function(x){return '<th>'+x+'</th>';}).join('')+'</tr>';
    var tbody=document.createElement('tbody');
    (cl.props||[]).forEach(function(p){ if(prefs.keyOnly&&!p.isKey) return; var tr=document.createElement('tr'); if(p.isKey)tr.className='pk-row'; tr.innerHTML=enterRow(p); tbody.appendChild(tr); });
    if(!tbody.children.length) tbody.innerHTML='<tr><td colspan="'+enterHead().length+'" class="empty">无字段</td></tr>';
    table.appendChild(thead); table.appendChild(tbody);
    return table;
  }

  /* ============================================================
     左侧树：懒渲染。只有展开的模块/组件才创建其子节点，
     避免一次性生成 4121 个导航节点占内存 / 卡顿。
     ============================================================ */
  function buildNicelConfTree(){
    nav.innerHTML='';
    var frag=document.createDocumentFragment();
    (agg.modules||[]).forEach(function(m,mi){
      frag.appendChild(makeMod(m,mi));
    });
    nav.appendChild(frag);
    if(!(agg.modules||[]).length){ nav.innerHTML='<div class="nav-empty">未读取到元数据</div>'; }
  }
  function makeMod(m,mi){
    var li=document.createElement('li'); li.className='mod';
    var mt=document.createElement('div'); mt.className='mt';
    mt.innerHTML='<span class="chester">&#9654;</span><span class="tname">'+esc(m.displayname||m.name)+'</span><span class="tcnt">'+(m.comps||[]).length+'</span>';
    var ulComps=document.createElement('ul'); ulComps.className='comps';
    mt.addEventListener('click',function(e){
      e.stopPropagation();
      if(li.classList.contains('open')){ li.classList.remove('open'); return; }
      if(!ulComps._loaded){ ulComps._loaded=true; buildCompsInto(ulComps,m,mi); }
      li.classList.add('open');
    });
    li.appendChild(mt); li.appendChild(ulComps);
    return li;
  }
  function makeComp(c,mi,ci){
    var li=document.createElement('li'); li.className='comp';
    var ct=document.createElement('div'); ct.className='ct';
    ct.innerHTML='<span class="cname">'+esc(c.displayname||c.name)+'</span><span class="ecnt">'+(c.classes||[]).length+'</span>';
    var ulClss=document.createElement('ul'); ulClss.className='clss';
    ct.addEventListener('click',function(e){
      e.stopPropagation();
      if(li.classList.contains('open')){ li.classList.remove('open'); return; }
      if(!ulClss._loaded){ ulClss._loaded=true; buildClssInto(ulClss,c,mi,ci); }
      li.classList.add('open');
    });
    li.appendChild(ct); li.appendChild(ulClss);
    return li;
  }
  function makeCl(cl,mi,ci,ei){
    var li=document.createElement('li'); li.className='cls';
    var c=document.createElement('div'); c.className='cl';
    var hasPk=(cl.props||[]).some(function(p){return p.isKey;});
    c.innerHTML=(hasPk?'<span class="pk">&#9733;</span>':'<span class="pk"></span>')+'<span class="d">'+esc(cl.displayName||cl.name)+'</span>';
    c.addEventListener('click',function(e){ e.stopPropagation(); openEntityTabByKey(cl.id); });
    li.appendChild(c); return li;
  }
  function buildCompsInto(ulComps,m,mi){ var frag=document.createDocumentFragment(); (m.comps||[]).forEach(function(c,ci){ frag.appendChild(makeComp(c,mi,ci)); }); ulComps.appendChild(frag); }
  function buildClssInto(ulClss,c,mi,ci){ var frag=document.createDocumentFragment(); (c.classes||[]).forEach(function(cl,ei){ frag.appendChild(makeCl(cl,mi,ci,ei)); }); ulClss.appendChild(frag); }

  /* ============================================================
     标签页：点击实体打开，只渲染这一个实体的字段表（省内存）
     ============================================================ */
  function openEntityTabByKey(id){
    var cl=findClassById(id);
    if(!cl){ toast('未找到该实体'); return; }
    var key='tab-'+id;
    if(openTabKeys[key]){ setActiveTab(key); return; }
    openTabKeys[key]=true; openTabs.push(key);
    var item=document.createElement('div'); item.className='tab-item'; item.setAttribute('data-tab',key);
    item.innerHTML='<span class="tname">'+esc(cl.displayName||cl.name)+'</span><button class="x">&#10005;</button>';
    item.querySelector('.x').addEventListener('click',function(e){ e.stopPropagation(); closeTab(key); });
    item.addEventListener('click',function(){ setActiveTab(key); });
    tabBar.insertBefore(item, tabBar.querySelector('.tab-close')||null);
    setActiveTab(key);
  }
  function closeTab(key){ var i=openTabs.indexOf(key); if(i<0)return; openTabs.splice(i,1); delete openTabKeys[key]; var it=tabBar.querySelector('.tab-item[data-tab="'+key+'"]'); if(it)it.remove(); if(activeTab===key){ activeTab=null; if(openTabs.length){ setActiveTab(openTabs[openTabs.length-1]); } else { tabs.classList.remove('open'); syncEmptyOverlay(); } } }
  function setActiveTab(key){
    if(!openTabKeys[key]) return;
    activeTab=key;
    var items=tabBar.querySelectorAll('.tab-item'); for(var i=0;i<items.length;i++){ items[i].classList.toggle('active',items[i].getAttribute('data-tab')===key); }
    var cl=findClassById(key.replace('tab-',''));
    if(cl) renderTabBody(cl);
    tabs.classList.add('open');
    syncEmptyOverlay();
  }
  function renderTabBody(cl){
    var fullName=cl.aggFullClassName||cl.fullClassName||'';
    var h='<div class="tab-inner"><span class="tclass">'+esc(cl.displayName||cl.name)+'</span>'+
      (cl.name?'<span class="tchip mono">'+esc(cl.name)+'</span>':'')+
      (cl.tableName?'<span class="tchip tbl">表 '+esc(cl.tableName)+'</span>':'')+
      (cl.componentId?'<span class="tchip">组件 '+esc(cl.componentId)+'</span>':'')+
      funcChips(cl)+
      (fullName?'<span class="tchip">'+esc(fullName)+'</span>':'')+
      (classTypeName(cl.classType)?'<span class="tchip">'+esc(classTypeName(cl.classType))+'</span>':'')+
      '</div>';
    tabBody.innerHTML=h;
    // 枚举类没有字段表表，展示其枚举值
    if(cl.classType===203 && !(cl.props&&cl.props.length) && enumIndex[cl.id]){
      var ev=enumIndex[cl.id];
      var tb=document.createElement('table'); tb.className='grid';
      tb.innerHTML='<thead><tr><th>值</th><th>名称</th></tr></thead><tbody>'+
        ev.map(function(v){ return '<tr><td class="mono">'+esc(v.value)+'</td><td>'+esc(v.name)+'</td></tr>'; }).join('')+
        '</tbody>';
      tabBody.appendChild(tb);
      return;
    }
    var table=makePropTable(cl);
    tabBody.appendChild(table);
  }

  /* ============================================================
     全局搜索（数据驱动）：只挑命中的实体，点开即打开标签页
     ============================================================ */
  function entMatchStr(cl){
    var s=[cl.displayName,cl.name,cl.tableName].join(' ').toLowerCase();
    return s;
  }
  function applyGlobalSearch(){
    var q=inputQ.value.trim().toLowerCase();
    var box=$('searchResults');
    if(!q){ if(box){ box.classList.remove('show'); } resCount.classList.remove('show'); return; }
    var hits=[];
    (agg.modules||[]).forEach(function(m){
      (m.comps||[]).forEach(function(c){
        (c.classes||[]).forEach(function(cl){
          if(entMatchStr(cl).indexOf(q)>-1){ hits.push(cl); }
          else if((cl.props||[]).some(function(p){ return (String(p.name||'')+' '+String(p.displayName||'')+' '+String(p.fieldType||'')+' '+String(p.typeName||'')+' '+String(p.description||'')).toLowerCase().indexOf(q)>-1; })){
            hits.push(cl);
          }
        });
      });
    });
    // 去重
    var seen={}, uniq=[]; hits.forEach(function(cl){ if(!seen[cl.id]){ seen[cl.id]=true; uniq.push(cl); } });
    renderSearchResults(uniq,q);
    resCount.textContent = '命中 '+uniq.length+' 个实体';
    resCount.classList.add('show');
  }
  function renderSearchResults(hits,q){
    var box=$('searchResults'); if(!box) return;
    box.innerHTML='';
    if(!hits.length){ box.innerHTML='<div class="sr-empty">未匹配到任何内容</div>'; box.classList.add('show'); return; }
    var ul=document.createElement('ul'); ul.className='sr-list';
    var cap = hits.length>300 ? 300 : hits.length;
    for(var i=0;i<cap;i++){
      var cl=hits[i];
      var li=document.createElement('li'); li.className='sr-item';
      var starred=(cl.props||[]).some(function(p){return p.isKey;});
      li.innerHTML='<span class="sr-pk">'+(starred?'&#9733;':'')+'</span><span class="sr-main">'+esc(cl.displayName||cl.name)+'</span>'+
        (cl.name?'<span class="sr-en">'+esc(cl.name)+'</span>':'')+
        (cl.tableName?'<span class="sr-tbl">'+esc(cl.tableName)+'</span>':'')+
        '<span class="sr-go">打开 &#9654;</span>';
      li.setAttribute('data-id', String(cl.id));
      (function(id){ li.addEventListener('click',function(){ closeSearchBox(); openEntityTabByKey(id); }); })(cl.id);
      ul.appendChild(li);
    }
    if(hits.length>cap){ var more=document.createElement('li'); more.className='sr-item sr-more'; more.textContent='... 仅显示前 '+cap+' 条，请细化关键词'; ul.appendChild(more); }
    box.appendChild(ul); box.classList.add('show');
  }
  function closeSearchBox(){ var b=$('searchResults'); if(b) b.classList.remove('show'); }

  /* ============================================================
     完整长页（打印用）：分批渲染，避免一次卡死。默认不渲染。
     ============================================================ */
  var longPageRunning=false, longPageTimer=null;
  function buildLongPage(){
    if(longPageRunning) return;
    longPageRunning=true;
    closeSearchBox();
    content.innerHTML='<div class="empty" id="lpProgress">正在生成完整长页，请稍候…</div>';
    var mods=agg.modules||[];
    var mi=0;
    function step(){
      if(mi>=mods.length){ finishLongPage(); return; }
      var m=mods[mi];
      var sec=document.createElement('section'); sec.className='mod'; sec.setAttribute('data-lp','1');
      var t=document.createElement('div'); t.className='modtitle';
      t.innerHTML='<span class="nm">'+esc(m.displayname||m.name)+'<span class="en">'+esc(m.name||'')+'</span></span><span class="cnt">'+(m.comps||[]).length+' 组件 · '+((m.comps||[]).reduce(function(s,c){return s+(c.classes||[]).length;},0))+' 实体</span>';
      var comps=document.createElement('div'); comps.className='comps';
      (m.comps||[]).forEach(function(c,ci){
        comps.appendChild(makeLongComp(c,mi,ci));
      });
      sec.appendChild(t); sec.appendChild(comps);
      content.appendChild(sec);
      mi++;
      var p=$('lpProgress'); if(p) p.textContent='正在生成完整长页… '+mi+' / '+mods.length+' 模块';
      longPageTimer=setTimeout(step,0);
    }
    function finishLongPage(){
      var p=$('lpProgress'); if(p) p.remove();
      // 全部展开实体表格
      Array.prototype.forEach.call(content.querySelectorAll('.entwrap'),function(w){ w.style.display='block'; });
      longPageRunning=false; longPageTimer=null;
      toast('完整长页已生成，可打印');
    }
    step();
  }
  function clearLongPage(){ if(longPageTimer){ clearTimeout(longPageTimer); longPageTimer=null; } longPageRunning=false; content.innerHTML=''; showEmptyState(); }
  function makeLongComp(c,mi,ci){
    var card=document.createElement('div'); card.className='compcard'; card.id='comp-'+mi+'-'+ci;
    var head=document.createElement('div'); head.className='comphead';
    var chips=[];
    if(c.billTypeName) chips.push('<span class="mtag bill">单据：'+esc(c.billTypeName)+'</span>');
    if(c.billTypeCode) chips.push('<span class="mtag bill">'+esc(c.billTypeCode)+'</span>');
    if(c.nodeName) chips.push('<span class="mtag node">节点：'+esc(c.nodeName)+'</span>');
    if(c.beanConfig) chips.push('<span class="mtag bean">Bean：'+esc(c.beanConfig)+'</span>');
    head.innerHTML='<div><div class="cn">'+esc(c.displayname||c.name)+'<span class="en">'+esc(c.name||'')+'</span></div>'+(chips.length?'<div class="compmeta">'+chips.join('')+'</div>':'')+'</div>'+
      '<span class="compadjust">收起 &#9650;</span>';
    head.addEventListener('click',function(){ toggleComp(card); });
    var wrap=document.createElement('div'); wrap.className='entwrap'; wrap.style.display='none';
    (c.classes||[]).forEach(function(cl,ei){ wrap.appendChild(makeLongEnt(cl,mi,ci,ei)); });
    card.appendChild(head); card.appendChild(wrap);
    return card;
  }
  function makeLongEnt(cl,mi,ci,ei){
    var ent=document.createElement('div'); ent.className='entity'; ent.id='ent-'+mi+'-'+ci+'-'+ei;
    var head=document.createElement('div'); head.className='ehead';
    var chips=['<span class="ki pk">实体</span>'];
    if(cl.tableName) chips.push('<span class="ki tbl">表 '+esc(cl.tableName)+'</span>');
    var fullName = cl.aggFullClassName||cl.fullClassName||''; var klassHtml='';
    if(fullName){ klassHtml='<span class="klass" title="'+esc(fullName)+'">'+(prefs.fullClass?esc(fullName):'AGG '+esc(shortClass(fullName)))+'</span>'; }
    var extra = funcChips(cl);
    head.innerHTML=chips.join('')+extra+'<span class="dn">'+esc(cl.displayName||cl.name)+'<span class="en">'+esc(cl.name||'')+'</span></span>'+klassHtml;
    var openBtn=document.createElement('button'); openBtn.className='ui plain'; openBtn.style.cssText='margin:10px 16px;padding:6px 12px;font-size:12px'; openBtn.textContent='在新标签页打开';
    (function(id){ openBtn.addEventListener('click',function(e){ e.stopPropagation(); openEntityTabByKey(id); }); })(cl.id);
    ent.appendChild(head); ent.appendChild(makePropTable(cl)); ent.appendChild(openBtn);
    return ent;
  }
  function toggleComp(card){ var wrap=card.querySelector('.entwrap'); var on=wrap.style.display!=='none'; wrap.style.display=on?'none':'block'; card.querySelector('.compadjust').innerHTML=on?'展开 &#9660;':'收起 &#9650;'; }

  function showEmptyState(){
    var has=(agg.modules||[]).length>0;
    content.innerHTML='<div class="empty greet"><div class="g-ico">&#128218;</div><p>'+(has?'点击左侧目录或搜索，打开实体查看字段。':'未读取到元数据，请检查连接。')+'</p></div>';
  }
  /* 空态覆盖：打开标签页时遮住/清掉主区提示，关掉全部后恢复 */
  function syncEmptyOverlay(){
    if(openTabs.length>0){
      if(content.querySelector('.greet')) content.innerHTML='';
    } else if(!longPageRunning){
      if(!content.children.length) showEmptyState();
    }
  }

  /* ---------- 主内容默认：空态（省内存） ---------- */
  showEmptyState();
  buildNicelConfTree();

  /* ---------- 搜索框 ---------- */
  var searchDeb;
  inputQ.addEventListener('input',function(){ clearTimeout(searchDeb); searchDeb=setTimeout(applyGlobalSearch,200); });
  inputQ.addEventListener('keydown',function(e){ if(e.key==='Escape'){ inputQ.value=''; applyGlobalSearch(); inputQ.blur(); } if(e.key==='Enter'&&$('searchResults').classList.contains('show')){ var f=$('searchResults').querySelector('.sr-item'); if(f){ closeSearchBox(); openEntityTabByKey(f.getAttribute('data-id')||f.querySelector('.sr-en').textContent); } } });
  document.addEventListener('click',function(e){ if(e.target!==inputQ && e.target.closest && !e.target.closest('#searchResults')){ closeSearchBox(); } });
  // 字段引用穿透：点击“引用模型”跳到被引用实体查看字段
  document.addEventListener('click',function(e){
    var rl=e.target.closest?e.target.closest('.ref-link'):null;
    if(rl){ e.preventDefault(); var id=rl.getAttribute('data-id'); if(id){ openEntityTabByKey(id); } }
  });

  /* ---------- 左侧树过滤（数据驱动，懒加载保持） ---------- */
  function applyNavFilter(){
    var q=navQ.value.trim().toLowerCase();
    // 清空重建整树最简单，但懒加载下会丢已展开状态。改用：数据驱动列出匹配模块/组件/实体（独立结果视图）。
    renderNavFilterResult(q);
  }
  var navResult;
  function clsHit(cl,q){
    if(!q) return true;
    if((cl.displayName||cl.name||'').toLowerCase().indexOf(q)>-1) return true;
    if((cl.tableName||'').toLowerCase().indexOf(q)>-1) return true;
    if((cl.name||'').toLowerCase().indexOf(q)>-1) return true;
    if((cl.fullClassName||cl.aggFullClassName||'').toLowerCase().indexOf(q)>-1) return true;
    return (cl.props||[]).some(function(p){ return (String(p.name||'')+' '+String(p.displayName||'')+' '+String(p.fieldType||'')+' '+String(p.typeName||'')+' '+String(p.description||'')).toLowerCase().indexOf(q)>-1; });
  }
  function renderNavFilterResult(q){
    if(!q){ if(navResult) navResult.remove(); $('nav').style.display=''; return; }
    if(!navResult){ navResult=document.createElement('div'); navResult.className='navtree'; navResult.id='navResult'; }
    navResult.innerHTML='';
    var mods=(agg.modules||[]);
    if(!mods.length){ navResult.innerHTML='<div class="nav-empty">未匹配到任何项</div>'; }
    var any=0;
    mods.forEach(function(m,mi){
      var modMatch=(m.displayname||m.name||'').toLowerCase().indexOf(q)>-1;
      var comps=[];
      (m.comps||[]).forEach(function(c,ci){
        var compMatch=(c.displayname||c.name||'').toLowerCase().indexOf(q)>-1;
        if(modMatch || compMatch){
          // 模块/组件名命中：秀出其全部下级（出现下级）
          var clsAll=[];
          (c.classes||[]).forEach(function(cl,ei){ clsAll.push({cl:cl,ci:ci,ei:ei}); });
          comps.push({c:c,ci:ci,cls:clsAll});
        } else {
          // 仅实体命中：只秀命中的实体
          var clsHitArr=[];
          (c.classes||[]).forEach(function(cl,ei){ if(clsHit(cl,q)) clsHitArr.push({cl:cl,ci:ci,ei:ei}); });
          if(clsHitArr.length) comps.push({c:c,ci:ci,cls:clsHitArr});
        }
      });
      if(!modMatch && !comps.length) return;
      any++;
      var ul=document.createElement('ul'); ul.className='navfilter-block';
      var modli=document.createElement('li'); modli.className='nf-mod';
      modli.innerHTML='<span class="nf-t">'+esc(m.displayname||m.name)+'</span>'+(modMatch?'<span class="nf-hit">命中</span>':'');
      ul.appendChild(modli);
      comps.forEach(function(CC){
        var cli=document.createElement('li'); cli.className='nf-comp';
        cli.innerHTML='<span class="nf-t">'+esc(CC.c.displayname||CC.c.name)+'</span>'+(CC.cls.length?'<span class="nf-ec">'+CC.cls.length+'</span>':'');
        if(CC.cls.length){
          var clsUl=document.createElement('ul');
          CC.cls.forEach(function(E){
            var cln=document.createElement('li'); cln.className='nf-cl';
            cln.innerHTML='<span class="sr-main">'+esc(E.cl.displayName||E.cl.name)+'</span>'+(E.cl.name?'<span class="sr-en">'+esc(E.cl.name)+'</span>':'')+(E.cl.tableName?'<span class="sr-tbl">'+esc(E.cl.tableName)+'</span>':'');
            (function(id){ cln.addEventListener('click',function(){ navQ.value=''; applyNavFilter(); openEntityTabByKey(id); }); })(E.cl.id);
            clsUl.appendChild(cln);
          });
          cli.appendChild(clsUl);
        }
        ul.appendChild(cli);
      });
      navResult.appendChild(ul);
    });
    if(!any){ navResult.innerHTML='<div class="nav-empty">未匹配到任何项</div>'; }
    var tree=$('nav'); tree.parentNode.insertBefore(navResult, tree.nextSibling); tree.style.display='none';
  }
  navQ.addEventListener('input',debounce(applyNavFilter,200));
  function debounce(fn,ms){ var t; return function(){ clearTimeout(t); var a=arguments,th=this; t=setTimeout(function(){fn.apply(th,a);},ms); }; }

  /* ---------- toolbar actions ---------- */
  $('btnExpand').onclick=buildLongPage;
  $('btnCollapse').onclick=clearLongPage;

  /* ---------- settings ---------- */
  $('btnSettings').onclick=function(){ drawer.classList.add('open'); scrim.classList.add('show'); syncSettingsUI(); };
  $('drClose').onclick=function(){ drawer.classList.remove('open'); scrim.classList.remove('show'); };
  scrim.onclick=function(){ drawer.classList.remove('open'); scrim.classList.remove('show'); };
  $('drDone').onclick=function(){ readSettings(); drawer.classList.remove('open'); scrim.classList.remove('show'); rerenderOpen(); toast('设置已应用'); };
  $('drReset').onclick=function(){ colState={name:true,dname:true,field:true,type:true,len:true,key:true,nullable:true,def:true,ref:true,desc:true}; prefs={keyOnly:false,fullClass:false,theme:'{{THEME}}'}; readSettings(); applyTheme('{{THEME}}'); drawer.classList.remove('open'); scrim.classList.remove('show'); rerenderOpen(); toast('已恢复默认'); };
  function rerenderOpen(){
    if(activeTab){ var cl=findClassById(activeTab.replace('tab-','')); if(cl) renderTabBody(cl); }
    // 若在长页视图，重绘长页
    var hasLP=content.querySelector('[data-lp="1"]'); if(hasLP){ buildLongPage(); }
  }
  function syncSettingsUI(){
    var map={ 'c-name':'name','c-dname':'dname','c-field':'field','c-type':'type','c-len':'len','c-key':'key','c-null':'nullable','c-def':'def','c-ref':'ref','c-desc':'desc' };
    for(var k in map){ $(k).checked = colState[map[k]]; }
    $('sw-keyonly').classList.toggle('on',prefs.keyOnly);
    $('sw-fullclass').classList.toggle('on',prefs.fullClass);
    var opts=document.querySelectorAll('#themeRow .theme-opt');
    for(var i=0;i<opts.length;i++){ opts[i].classList.toggle('active', opts[i].getAttribute('data-theme')===prefs.theme); }
  }
  function readSettings(){
    var map={ 'c-name':'name','c-dname':'dname','c-field':'field','c-type':'type','c-len':'len','c-key':'key','c-null':'nullable','c-def':'def','c-ref':'ref','c-desc':'desc' };
    for(var k in map){ colState[map[k]] = $(k).checked; }
    prefs.keyOnly = $('sw-keyonly').classList.contains('on');
    prefs.fullClass = $('sw-fullclass').classList.contains('on');
  }
  function makeSwitch(id,onchange){ var el=$(id); el.addEventListener('click',function(){ el.classList.toggle('on'); onchange(el.classList.contains('on')); }); }
  makeSwitch('sw-keyonly',function(v){ prefs.keyOnly=v; rerenderOpen(); });
  makeSwitch('sw-fullclass',function(v){ prefs.fullClass=v; rerenderOpen(); });
  /* 主题选择：点击即应用 */
  (function(){
    var opts=document.querySelectorAll('#themeRow .theme-opt');
    for(var i=0;i<opts.length;i++){
      (function(opt){ opt.addEventListener('click',function(){ applyTheme(opt.getAttribute('data-theme')); }); })(opts[i]);
    }
  })();
  applyTheme(prefs.theme);

  /* ---------- back to top ---------- */
  var toTop=$('toTop');
  window.addEventListener('scroll',function(){ toTop.classList.toggle('show',window.scrollY>400); },{passive:true});
  toTop.onclick=function(){ window.scrollTo({top:0,behavior:'smooth'}); };

  /* ---------- shortcut ---------- */
  document.addEventListener('keydown',function(e){
    var tag=(e.target.tagName||'').toLowerCase();
    if(e.key==='/' && tag!=='input' && tag!=='textarea'){ e.preventDefault(); inputQ.focus(); }
  });
})();

</script>
</body>
