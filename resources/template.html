<!DOCTYPE html>
<html lang="zh-CN" data-theme="{{THEME}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NC 数据字典</title>
<style>
/* ============================================================
   NC 数据字典 · 界面样式 v3
   "精密工程手册" 设计：深海军蓝结构色 + 单一主蓝 + 发丝级边框
   所有主题均通过 CSS 变量驱动（html[data-theme] 只换变量）
   ============================================================ */

/* ---------------- 令牌：经典蓝（默认） ---------------- */
:root{
  --brand-deep:#0E2A5C;
  --brand:#1A56DB;
  --brand-strong:#1747B8;
  --brand-dark:#0B2B7A;

  --canvas:#F4F6FA;
  --card:#FFFFFF;
  --card-2:#FAFBFF;

  --ink:#16213E;
  --ink-2:#415072;
  --muted:#7180A0;
  --muted-2:#97A0B5;

  --line:#E3E8F2;
  --line-2:#EEF1F8;

  --brand-bg:#E9F0FF;
  --brand-soft:#E7EEFF;
  --brand-softer:#F0F5FF;

  --ok:#0E8345;
  --ok-bg:#E7F6EE;
  --warn:#B45309;
  --warn-bg:#FEF3E2;
  --err:#D92D20;
  --err-bg:#FDECEC;

  --tag-line:#D4DEFA;
  --tag-bg:#EFF3FE;
  --chip:#F1F4FA;

  --r-xs:4px;
  --r-sm:6px;
  --r-md:9px;
  --r-lg:12px;

  --line-rgba:rgba(20,45,100,.08);
  --line-2-rgba:rgba(20,45,100,.05);

  --mono:"Cascadia Code","JetBrains Mono",Consolas,"Courier New",monospace;

  --shadow-chip:0 1px 2px rgba(16,24,40,.06);
  --shadow-pop:0 12px 32px rgba(14,42,92,.16),0 3px 10px rgba(14,42,92,.08);
  --shadow-dr:0 0 42px rgba(14,42,92,.28);
}

/* ---------------- 令牌：暗色 ---------------- */
html[data-theme="dark"]{
  --brand-deep:#7FA8F0;
  --brand:#5B8DEF;
  --brand-strong:#4D7CE0;
  --brand-dark:#A8C6FF;

  --canvas:#0E1420;
  --card:#151D2D;
  --card-2:#192238;

  --ink:#E6ECF8;
  --ink-2:#B4C0D8;
  --muted:#8B98B8;
  --muted-2:#67748F;

  --line:#273147;
  --line-2:#202A3E;

  --brand-bg:#17233C;
  --brand-soft:#1B2A4A;
  --brand-softer:#182542;

  --ok:#3DD68C;
  --ok-bg:#122C21;
  --warn:#F5B754;
  --warn-bg:#2E2513;
  --err:#F36A5E;
  --err-bg:#331A1C;

  --tag-line:#2C4C8A;
  --tag-bg:#16254A;
  --chip:#1B2438;

  --line-rgba:rgba(120,150,220,.12);
  --line-2-rgba:rgba(120,150,220,.07);
}

/* ---------------- 令牌：青绿 ---------------- */
html[data-theme="teal"]{
  --brand-deep:#064E3B;
  --brand:#0E7C5F;
  --brand-strong:#0C6B52;
  --brand-dark:#0B5C47;

  --canvas:#F4F8F7;
  --card-2:#FAFDFC;

  --ink:#14302A;
  --ink-2:#3E5A53;
  --muted:#6E8A82;
  --muted-2:#93AAA3;

  --line:#DDE9E5;
  --line-2:#EDF4F2;

  --brand-bg:#E2F1EC;
  --brand-soft:#DFF0EA;
  --brand-softer:#EDF7F4;

  --tag-line:#C9E4DA;
  --tag-bg:#E9F6F1;
  --chip:#EDF3F1;

  --line-rgba:rgba(6,78,59,.08);
  --line-2-rgba:rgba(6,78,59,.05);
}

/* ---------------- 令牌：极简浅色 ---------------- */
html[data-theme="min-light"]{
  --brand-deep:#111827;
  --brand:#2F3B52;
  --brand-strong:#283349;
  --brand-dark:#1F2937;

  --canvas:#F7F8FA;
  --card-2:#FBFCFE;

  --ink:#1F2937;
  --ink-2:#4B5563;
  --muted:#6B7280;
  --muted-2:#9CA3AF;

  --line:#E5E7EB;
  --line-2:#F1F2F4;

  --brand-bg:#F1F3F6;
  --brand-soft:#F3F5F8;
  --brand-softer:#F8F9FB;

  --tag-line:#DADEE5;
  --tag-bg:#F1F3F6;
  --chip:#F0F2F5;

  --line-rgba:rgba(17,24,39,.07);
  --line-2-rgba:rgba(17,24,39,.04);
}

/* ============================================================
   基础
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
  font-size:13px;color:var(--ink);background:var(--canvas);line-height:1.55;
}
a{color:var(--brand);text-decoration:none}
.mono{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
mark.hit{background:var(--warn-bg);color:var(--warn);border-radius:2px;padding:0 1px}
.wrap{max-width:1500px;margin:0 auto;padding:0 28px}

/* ============================================================
   顶栏
   ============================================================ */
header{
  background:var(--brand-deep);
  background-image:radial-gradient(1100px 300px at 85% -80%,rgba(90,140,255,.22),transparent 60%);
  color:#fff;
}
.hd-inner{max-width:1500px;margin:0 auto;padding:18px 28px 0}
.hd-row{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.logo{
  width:42px;height:42px;border-radius:10px;flex-shrink:0;
  background:var(--brand);display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:16px;letter-spacing:.5px;
  box-shadow:0 4px 14px rgba(10,40,120,.35);
}
.hd-titles{flex:1;min-width:0}
.hd-titles h1{font-size:19px;font-weight:800;letter-spacing:.3px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.ver-tag{
  font-size:11px;font-weight:700;background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.22);border-radius:99px;padding:1px 9px;
}
.turmo{font-size:10.5px;font-weight:700;letter-spacing:3px;opacity:.75;margin-left:2px;text-transform:uppercase}
.hd-titles .sub{margin-top:3px;font-size:12px;opacity:.78;font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{
  display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;
  color:rgba(255,255,255,.88);background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.14);border-radius:7px;padding:3px 10px;
}
.chip b{color:#fff;font-weight:700;font-family:var(--mono);font-size:11px}
.chip .dot{width:6px;height:6px;border-radius:50%;background:#3DD68C;display:inline-block}

/* ============================================================
   工具条
   ============================================================ */
.toolbar{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  max-width:1500px;margin:0 auto;padding:12px 28px;
  background:var(--card);border-bottom:1px solid var(--line);
}
.grow{flex:1;min-width:260px}
.searchwrap{position:relative}
.searchwrap .ico{
  position:absolute;left:11px;top:50%;transform:translateY(-50%);
  font-size:13px;opacity:.55;pointer-events:none;
}
.searchwrap input#q{
  width:100%;padding:8px 34px 8px 33px;
  border:1px solid var(--line);border-radius:999px;
  background:var(--canvas);color:var(--ink);font-size:12.5px;outline:none;transition:.15s;
}
.searchwrap input#q:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-bg);background:var(--card)}
.searchwrap .kbd{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  font-size:11px;color:var(--muted-2);border:1px solid var(--line);
  border-radius:5px;padding:0 6px;background:var(--card);font-family:var(--mono);
}
.toolbar .stats{font-size:12.5px;color:var(--muted);white-space:nowrap}
.toolbar .stats b{color:var(--brand-deep);font-weight:800;font-family:var(--mono);font-size:12.5px}
#resCount{
  font-size:11.5px;color:var(--brand-dark);background:var(--brand-soft);
  border:1px solid var(--tag-line);border-radius:99px;padding:2px 10px;
  display:none;white-space:nowrap;font-weight:600;
}
#resCount.show{display:inline-block}
button.ui{
  font-family:inherit;font-size:12.5px;font-weight:600;border-radius:7px;
  padding:7px 14px;cursor:pointer;border:1px solid transparent;
  transition:background .15s,border-color .15s,color .15s;white-space:nowrap;
}
button.ui.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
button.ui.primary:hover{background:var(--brand-strong)}
button.ui.plain{background:var(--card);color:var(--ink-2);border-color:var(--line)}
button.ui.plain:hover{color:var(--brand);border-color:var(--brand);background:var(--brand-soft)}
button.ui.ghost{background:transparent;color:var(--brand-dark);border-color:var(--tag-line)}
button.ui.ghost:hover{background:var(--brand-soft)}

/* ============================================================
   布局
   ============================================================ */
main{display:flex;max-width:1500px;margin:0 auto;padding:20px 28px 8px;gap:20px;align-items:flex-start}
aside{width:300px;flex-shrink:0;position:sticky;top:16px;max-height:calc(100vh - 34px);display:flex;flex-direction:column}
article{flex:1;min-width:0}
footer{max-width:1500px;margin:0 auto;padding:16px 28px 26px}
.footline{font-size:11.5px;color:var(--muted-2);border-top:1px solid var(--line);padding-top:12px}

/* ============================================================
   卡片 / 导航
   ============================================================ */
.navcard{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);
  display:flex;flex-direction:column;overflow:hidden;
}
.ntitle{
  font-size:13px;font-weight:800;color:var(--ink);
  padding:11px 14px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--line);
}
.ntitle .mini{font-size:11px;font-weight:500;color:var(--muted-2)}
.navsearch{padding:10px}
.navsearch input{
  width:100%;padding:7px 11px;border:1.5px solid var(--line);border-radius:var(--r-sm);
  font-size:12.5px;color:var(--ink);background:var(--card-2);outline:none;transition:.15s;
}
.navsearch input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-bg);background:var(--card)}

/* ============================================================
   左侧树（懒加载）.navtree 同时用于 #nav 与 #navResult
   ============================================================ */
.navtree{overflow-y:auto;flex:1;padding:6px 6px 12px;font-size:12.5px}
.navtree ul{list-style:none}
.navtree .nav-empty{padding:22px 12px;color:var(--muted-2);text-align:center;font-size:12px}
.navtree .mt,.navtree .ct,.navtree .cl{
  display:flex;align-items:center;gap:5px;border-radius:var(--r-sm);
  cursor:pointer;color:var(--ink-2);
}
.navtree .mt{padding:8px 8px 8px 7px;font-weight:700;color:var(--ink)}
.navtree .ct{padding:6px 8px 6px 12px}
.navtree .cl{padding:5px 8px 5px 18px}
.navtree .chester{font-size:9px;color:var(--muted-2);width:10px;flex-shrink:0;transition:transform .18s}
.navtree .mt:hover{background:var(--card-2);color:var(--brand-deep)}
.navtree .ct:hover{background:var(--card-2);color:var(--ink)}
.navtree .cl:hover{background:var(--brand-bg);color:var(--brand-deep)}
.navtree .mt .tname,.navtree .ct .cname{
  flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;min-width:0;
}
.navtree .cl .d{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.navtree .cl .pk{color:var(--warn);font-size:11px;width:12px;text-align:center;flex-shrink:0}
.navtree .tcnt,.navtree .ecnt{
  font-size:10.5px;font-weight:700;color:var(--muted-2);
  background:var(--chip);border-radius:99px;padding:0 7px;flex-shrink:0;font-family:var(--mono);
}
.navtree .ct.active{background:var(--brand-bg);color:var(--brand-deep)}
.navtree .cl.active{background:var(--brand-soft);color:var(--brand-deep);font-weight:700}
/* 展开机制：子节点常驻 DOM，折叠靠 display:none（关键，勿删） */
.navtree .mod>ul.comps{display:none;padding-left:6px}
.navtree .mod.open>ul.comps{display:block}
.navtree .comp>ul.clss{display:none;padding-left:4px}
.navtree .comp.open>ul.clss{display:block}
.navtree .mod.open>.mt{background:var(--brand-softer);color:var(--brand-deep)}
.navtree .mod.open>.mt .chester{transform:rotate(90deg);color:var(--brand)}
.navtree .mod.open>.mt .tname{color:var(--brand-deep)}
/* 懒加载提示 */
.navtree .mod.loading>.mt .tname::after{content:'…加载中';font-size:11px;color:var(--muted);margin-left:6px;font-weight:400}

/* 树内过滤结果 */
#navResult{padding-top:4px}
#navResult .nf-mod{
  display:flex;align-items:center;gap:6px;padding:7px 8px 5px;
  font-weight:800;color:var(--brand-deep);font-size:12.5px;
  border-bottom:1px dashed var(--line-2);margin:2px 0 4px;
}
#navResult .nf-mod .nf-hit{font-size:10px;color:var(--ok);background:var(--ok-bg);border-radius:99px;padding:0 7px;font-weight:700}
#navResult .nf-comp{display:flex;align-items:center;gap:6px;padding:6px 8px 4px;color:var(--ink-2);font-weight:600}
#navResult .nf-comp .nf-t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
#navResult .nf-ec{font-size:10px;color:var(--muted-2);font-family:var(--mono)}
#navResult .nf-cl{display:flex;align-items:center;gap:7px;padding:4px 12px 4px 18px;border-radius:var(--r-sm);cursor:pointer}
#navResult .nf-cl:hover{background:var(--brand-bg)}
#navResult .nf-cl .sr-main{
  font-weight:600;color:var(--ink);font-size:12.3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;
}
#navResult .nf-cl .sr-en{font-family:var(--mono);font-size:10.5px;color:var(--muted-2);max-width:16ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}
#navResult .nf-cl .sr-tbl{
  font-size:10.5px;color:var(--brand-dark);background:var(--brand-soft);
  border-radius:4px;padding:0 5px;font-family:var(--mono);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:18ch;flex-shrink:0;margin-left:auto;
}

/* ============================================================
   标签页
   ============================================================ */
#tabs{display:none;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
#tabs.open{display:flex}
.tab-bar{
  display:flex;align-items:center;gap:6px;background:var(--card-2);
  border-bottom:1px solid var(--line);padding:8px 12px 6px;overflow-x:auto;
}
.tab-item{
  display:inline-flex;align-items:center;gap:6px;padding:6px 9px 5px 13px;
  border:1px solid var(--line);border-bottom:none;background:var(--card);
  border-radius:var(--r-sm) var(--r-sm) 0 0;cursor:pointer;color:var(--ink-2);
  font-size:12.5px;font-weight:600;max-width:230px;flex-shrink:0;
}
.tab-item:hover{color:var(--brand)}
.tab-item.active{background:var(--brand-soft);color:var(--brand-deep);border-color:var(--brand);box-shadow:0 -2px 0 var(--brand) inset}
.tab-item .tname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:19ch}
.tab-item .x{
  border:none;background:none;color:var(--muted-2);cursor:pointer;
  font-size:16px;line-height:1;padding:0 3px;border-radius:50%;flex-shrink:0;
}
.tab-item .x:hover{color:var(--err)}
.tab-close{margin-left:auto;border:none;background:none;color:var(--muted-2);cursor:pointer;font-size:16px;padding:8px;flex-shrink:0}
.tab-close:hover{color:var(--err)}
.tab-body{padding:20px 22px 26px;min-height:180px;overflow-x:auto}

/* 表头信息条 */
.tab-inner{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;
  border-bottom:1px solid var(--line);padding-bottom:14px;
}
.tclass{font-size:18px;font-weight:800;color:var(--ink);letter-spacing:.2px}
.tchip{
  font-size:11px;font-weight:600;color:var(--ink-2);background:var(--chip);
  border:1px solid var(--line);border-radius:6px;padding:2px 8px;
}
.tchip.mono{font-family:var(--mono);color:var(--muted)}
.tchip.tbl{background:var(--brand-soft);color:var(--brand-deep);border-color:var(--tag-line);font-family:var(--mono)}
.tchip.func{background:var(--tag-bg);color:var(--brand-deep);border-color:var(--tag-line)}

/* ============================================================
   主从关系导航面板
   ============================================================ */
.relpanel{background:var(--card-2);border:1px solid var(--line);border-radius:var(--r-md);margin:0 0 16px;overflow:hidden}
.relpanel-head{border-bottom:1px solid var(--line);padding:9px 14px}
.rel-cap{display:inline-flex;align-items:center;gap:7px;font-weight:800;font-size:12.5px;color:var(--ink)}
.rel-cap svg{width:15px;height:15px;color:var(--brand)}
.relpanel-body{padding:10px 14px 12px;display:flex;flex-direction:column;gap:9px}
.rel-sec{display:flex;align-items:flex-start;gap:10px}
.rel-tag{
  flex-shrink:0;font-size:11px;font-weight:800;border-radius:99px;
  padding:2px 10px;letter-spacing:.3px;margin-top:3px;
}
.rel-tag.rt-child{background:var(--brand-soft);color:var(--brand-deep);border:1px solid var(--tag-line)}
.rel-tag.rt-parent{background:var(--ok-bg);color:var(--ok);border:1px solid var(--brand-soft)}
.rel-tag.rt-none{background:var(--chip);color:var(--muted);border:1px solid var(--line)}
.rel-items{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
a.rel-link{
  display:inline-flex;align-items:center;gap:4px;
  font-size:12.3px;font-weight:600;color:var(--brand-deep);
  background:var(--brand-softer);border:1px solid var(--tag-line);border-radius:7px;
  padding:4px 11px;transition:.15s;max-width:100%;
}
a.rel-link:hover{background:var(--brand-soft);border-color:var(--brand);transform:translateY(-1px)}
a.rel-link .arr{font-size:11px;color:var(--brand);font-weight:900}
a.rel-link .rel-sub{font-size:11px;font-weight:500;color:var(--muted);font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rel-empty{font-size:12.5px;color:var(--ink-2)}
.rel-empty .hint{color:var(--muted-2);font-size:11.5px}

/* ============================================================
   实体字段表（主角）
   ============================================================ */
table.grid{
  width:100%;border-collapse:collapse;
  background:var(--card);font-size:12.5px;
  border:1px solid var(--line);
  /* 注意: collapse 模式下 table 自身 radius 不生效,
     圆角由下列单元格规则提供; 不加 overflow:hidden 以免破坏 sticky */
}
table.grid thead th{
  background:var(--brand-deep);color:#fff;font-weight:700;font-size:12px;
  text-align:left;padding:9px 12px;letter-spacing:.3px;white-space:nowrap;
  position:sticky;top:0;z-index:2;
}
table.grid thead th:first-child{border-top-left-radius:var(--r-md)}
table.grid thead th:last-child{border-top-right-radius:var(--r-md)}
table.grid tbody td{padding:7px 12px;border-bottom:1px solid var(--line-2);vertical-align:top;color:var(--ink-2)}
table.grid tbody tr:last-child td{border-bottom:none}
table.grid tbody tr:nth-child(even){background:var(--card-2)}
table.grid tbody tr:hover{background:var(--brand-softer)}
table.grid tbody tr.pk-row{background:rgba(26,86,219,.06)}
table.grid tbody tr.pk-row:hover{background:var(--brand-soft)}
table.grid tbody tr.pk-row td{color:var(--ink)}
table.grid td.empty{color:var(--muted-2);text-align:center;padding:26px}
table.grid td.mono{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.pkstar,.table .pkstar{color:var(--err);font-weight:900;font-size:11px;letter-spacing:.5px}

/* 类型徽标：收敛 5 种 */
.tbadge{
  display:inline-block;font-size:11px;font-weight:700;border-radius:5px;
  padding:1px 8px;border:1px solid transparent;font-family:var(--mono);white-space:nowrap;
}
.tbadge.str{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-bg)}
.tbadge.num{background:var(--brand-bg);color:var(--brand-deep);border-color:var(--brand-bg)}
.tbadge.date{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-bg)}
.tbadge.blob{background:var(--tag-bg);color:var(--brand-dark);border-color:var(--tag-bg)}
.tbadge.bool{background:var(--brand-soft);color:var(--brand-strong);border-color:var(--brand-soft)}
.null-flag{font-size:10.5px;color:var(--muted-2);background:var(--chip);border-radius:5px;padding:1px 7px;white-space:nowrap}
a.ref-link{color:var(--brand);font-weight:600}
a.ref-link:hover{text-decoration:underline}

/* 枚举值块 */
.enumbox{margin-top:6px;border-left:3px solid var(--brand);background:var(--brand-bg);border-radius:0 7px 7px 0;padding:5px 10px;display:flex;flex-direction:column;gap:3px}

.enumbox .enm{font-size:11px;color:var(--ink-2);margin-left:2px}

/* ============================================================
   全局搜索结果浮层
   ============================================================ */
#searchResults{
  position:absolute;top:calc(100% + 9px);left:0;right:0;z-index:120;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);
  box-shadow:var(--shadow-pop);max-height:430px;overflow:auto;display:none;padding:6px;
}

.sr-list{list-style:none}

}
.sr-item:hover{background:var(--brand-bg)}
.sr-pk{color:var(--warn);font-size:11px;width:10px;text-align:center;flex-shrink:0}
.sr-main{
  font-weight:700;color:var(--ink);font-size:12.8px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:30ch;
}
.sr-en{font-family:var(--mono);font-size:11px;color:var(--muted-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:20ch;flex-shrink:0}
.sr-tbl{
  font-size:10.5px;background:var(--brand-soft);color:var(--brand-deep);
  border-radius:4px;padding:0 6px;font-family:var(--mono);white-space:nowrap;flex-shrink:0;
}
.sr-go{margin-left:auto;font-size:11px;color:var(--brand);font-weight:700;opacity:0;transition:.12s;flex-shrink:0}
.sr-item:hover .sr-go{opacity:1}
.sr-empty,.nav-empty{padding:20px 12px;color:var(--muted-2);text-align:center;font-size:12px}
.sr-more{justify-content:center;color:var(--muted);font-size:11.5px;cursor:default}

/* ============================================================
   主内容区 / 空态
   ============================================================ */
#content .empty{padding:80px 30px;color:var(--muted-2);text-align:center;font-size:13px}
.empty.greet{display:flex;flex-direction:column;align-items:center;gap:14px}
.empty.greet .g-ico{font-size:46px;opacity:.85}
.empty.greet p{color:var(--muted);font-size:13.5px}

/* ============================================================
   完整长页（打印视图）
   ============================================================ */
section.mod{margin-bottom:26px}
.modtitle{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:var(--brand-deep);color:#fff;border-radius:var(--r-md) var(--r-md) 0 0;
  padding:11px 16px;
}
.modtitle .nm{font-size:15px;font-weight:800;display:inline-flex;align-items:baseline;gap:9px}
.modtitle .nm .en{font-size:11px;font-weight:500;opacity:.75;font-family:var(--mono)}
.modtitle .cnt{font-size:11.5px;opacity:.85;margin-left:auto;font-weight:500}
section.mod>.comps{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.compcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.comphead{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--card-2);border-bottom:1px solid var(--line);
  padding:11px 16px;cursor:pointer;
}
.comphead:hover{background:var(--brand-softer)}
.comphead .cn{font-size:14.5px;font-weight:800;color:var(--ink)}
.comphead .cn .en{font-size:11px;font-weight:500;color:var(--muted);font-family:var(--mono);margin-left:8px}
.compmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.mtag{font-size:10.5px;font-weight:600;border-radius:5px;padding:1px 8px;background:var(--chip);color:var(--muted);border:1px solid var(--line)}
.mtag.bill{background:var(--brand-soft);color:var(--brand-deep);border-color:var(--tag-line)}
.mtag.node{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-bg)}
.mtag.bean{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-bg)}
.compadjust{font-size:11.5px;color:var(--brand);font-weight:700;white-space:nowrap}
.entwrap{background:var(--card)}
.entity{padding:14px 16px;border-bottom:1px solid var(--line-2)}
.entity:last-child{border-bottom:none}
.ehead{
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;

.ehead .ki{font-size:10.5px;font-weight:800;border-radius:5px;padding:1px 8px;letter-spacing:.4px;border:1px solid transparent}
.ehead .ki.pk{background:var(--err-bg);color:var(--err);border-color:var(--err-bg)}

   右侧抽屉（设置）
   ============================================================ */
#scrim{position:fixed;inset:0;background:rgba(10,18,40,.42);z-index:140;opacity:0;visibility:hidden;transition:.22s}

  position:fixed;top:0;right:0;bottom:0;width:380px;max-width:92vw;z-index:150;

}

.dr-head .t{font-weight:800;font-size:15px;color:var(--ink)}
.dr-close{border:none;background:none;font-size:19px;color:var(--muted-2);cursor:pointer;padding:4px;border-radius:6px}
.dr-close:hover{color:var(--ink);background:var(--card-2)}
.dr-body{flex:1;overflow:auto;padding:16px 18px 28px}
.set-group{margin-bottom:22px}
.set-group .gt{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.check-row{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13px;color:var(--ink-2);cursor:pointer;transition:.12s}
.check-row:hover{color:var(--brand)}
.check-row input{width:16px;height:16px;accent-color:var(--brand);cursor:pointer}
.switch-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px dashed var(--line-2)}
.switch-row:last-child{border-bottom:none}
.switch-row .lab{font-size:13px;color:var(--ink-2);font-weight:500}
.switch{position:relative;width:40px;height:22px;background:var(--line);border-radius:999px;cursor:pointer;transition:.2s;flex-shrink:0}
.switch::after{
  content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;
  border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s;
}
.switch.on{background:var(--brand)}
.switch.on::after{left:20px}
.theme-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.theme-opt{
  display:flex;flex-direction:column;align-items:center;gap:7px;
  padding:12px 6px;border:2px solid var(--line);border-radius:var(--r-md);
  cursor:pointer;transition:border-color .15s,box-shadow .15s;background:var(--card);
}
.theme-opt:hover{border-color:var(--brand)}
.theme-opt.active{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-bg)}
.theme-opt .sw{width:100%;height:44px;border-radius:var(--r-sm)}
.theme-opt .tn{font-size:12px;color:var(--ink-2);font-weight:600}
.theme-opt.active .tn{color:var(--brand-deep);font-weight:700}
html[data-theme="dark"] .theme-opt .sw{border:1px solid #35466a}
.dr-foot{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:10px}
.dr-foot button{flex:1}

/* ============================================================
   Toast / 回到顶部
   ============================================================ */
#toast{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(18px);
  background:var(--ink);color:#fff;font-size:12.5px;font-weight:600;
  border-radius:99px;padding:9px 20px;z-index:200;
  opacity:0;visibility:hidden;transition:.22s;box-shadow:var(--shadow-pop);
}
#toast.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
#toTop{
  position:fixed;right:26px;bottom:30px;width:42px;height:42px;border-radius:50%;
  border:1px solid var(--line);background:var(--card);color:var(--brand);
  font-size:15px;cursor:pointer;z-index:90;box-shadow:var(--shadow-chip);
  opacity:0;visibility:hidden;transform:translateY(8px);transition:.2s;
}
#toTop.show{opacity:1;visibility:visible;transform:translateY(0)}
#toTop:hover{background:var(--brand-soft);transform:translateY(-2px)}

/* ============================================================
   打印
   ============================================================ */
@media print{
  header,footer,.toolbar,aside,#tabs,#toTop,#toast{display:none!important}
  body{background:#fff;color:#000}
  main{display:block;padding:0;max-width:none}
  #content{display:block!important}
  .compcard,.entity,.modtitle{break-inside:avoid}
  section.mod{break-inside:auto}
  html[data-theme="dark"],html[data-theme="teal"],html[data-theme="min-light"]{
    --canvas:#fff;--card:#fff;--card-2:#fff;
    --ink:#111;--ink-2:#333;--muted:#555;
    --line:#ddd;--line-2:#eee;
    --brand-deep:#0E2A5C;--brand:#1A56DB;
  }
}

/* ============================================================
   响应式
   ============================================================ */
@media (max-width:960px){
  main{flex-direction:column}
  aside{width:100%;position:static;max-height:340px}
  .toolbar{gap:8px}
  .toolbar .stats{display:none}
}

<script>

<script>
(function(){

  var tabs = $('tabs'), tabBar = $('tabBar'), tabBody = $('tabBody');
  var openTabs = [], activeTab = null, openTabKeys = {};

  /* ---------- helpers ---------- */
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function toast(msg){ var t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._tm); t._tm=setTimeout(function(){t.classList.remove('show');},1800); }
  function miOf(m){ return (agg.modules||[]).indexOf(m); }

  /* ---------- 分片加载（方案2）：每个模块一个 m<i>.js 文件，按需 <script> 注入 ----------
     单文件模式（旧版导出，无 DATA_DIR）下 m.comps 已就位，所有加载函数自动短路，
     行为与旧版完全一致。 */
  function moduleStats(m){
    if(m._cs!=null){ return {c:m._cs,e:m._es,p:m._ps}; }
    var c=(m.comps||[]).length, e=0, p=0;
    (m.comps||[]).forEach(function(x){ e+=(x.classes||[]).length; (x.classes||[]).forEach(function(cl){ p+=(cl.props||[]).length; }); });
    m._cs=c; m._es=e; m._ps=p;

  function loadMod(i, cb){

    arr.forEach(function(f){

  $('grp').textContent = agg.groupName||'-';
  $('dbh').textContent = agg.databaseName||'-';
  $('time').textContent = agg.generateTime||'-';
  $('remark').textContent = agg.remark||'NC 数据字典';
  document.title = (agg.remark||'NC 数据字典')+' · NC 数据字典 '+(agg.ncVersion||'');

  /* ---------- stats ---------- */
  var totalC=0,totalE=0,totalP=0;
  (agg.modules||[]).forEach(function(m){ var s=moduleStats(m); totalC+=s.c; totalE+=s.e; totalP+=s.p; });
  $('stM').textContent=(agg.modules||[]).length;
  $('stC').textContent=totalC; $('stE').textContent=totalE; $('stP').textContent=totalP;
  $('navMini').textContent = (agg.modules||[]).length+' 模块 · '+totalE+' 实体';

  /* ---------- 数据索引：按 class.id O(1) 查找 + 枚举值（refId -> 枚举值列表） ----------
     分片模式每加载完一个模块都要重建索引，所以设计成可重复执行的 rebuildIndexes()。 */
  var classIndex = Object.create(null);   // id -> cl
  var enumIndex = Object.create(null);    // refId -> enumValues
  var masterChildren = Object.create(null);  // 主表 id -> [子表 cl]
  var childMasters = Object.create(null);    // 子表 id -> [主表 cl]
  function rebuildIndexes(){
    Object.keys(classIndex).forEach(function(k){ delete classIndex[k]; });
    Object.keys(enumIndex).forEach(function(k){ delete enumIndex[k]; });
    Object.keys(masterChildren).forEach(function(k){ delete masterChildren[k]; });
    Object.keys(childMasters).forEach(function(k){ delete childMasters[k]; });
    if(agg.modules){
      var allClasses=[];
      (agg.modules||[]).forEach(function(m){
        (m.comps||[]).forEach(function(c){
          (c.classes||[]).forEach(function(cl){
            if(cl && cl.id){ classIndex[cl.id]=cl; }
            if(cl) allClasses.push(cl);
          });
          (c.classes||[]).forEach(function(cl){
            (cl.props||[]).forEach(function(p){
              if(p && p.refId && p.enumValues && p.enumValues.length && !enumIndex[p.refId]){ enumIndex[p.refId]=p.enumValues; }
            });
          });
        });
      });
      /* 主从关系（主表 ⇄ 子表）
         首选真实信号：md_table.resmodule —— 同一 resmodule 归为一组，isMaster 标记主表，
         该组其余实体即主表的子表（bd_cjpsndoc 个人基本信息 + 多个 bd_psn_* 子表等都能正确识别）。
         当导出数据没带 resmodule（旧版或 md_table 不可读）时，回退到传统表名约定 <base>_b。 */
      var usesResmodule=false;
      allClasses.forEach(function(cl){ if(cl && cl.resmodule){ usesResmodule=true; } });
      var byModule = Object.create(null);        // resmodule -> [cl]
      var masterByModule = Object.create(null);  // resmodule -> 主表 cl
      if(usesResmodule){
        allClasses.forEach(function(cl){
          var rm=cl.resmodule; if(!rm) return;
          (byModule[rm]=byModule[rm]||[]).push(cl);
          if(cl.isMaster && !masterByModule[rm]) masterByModule[rm]=cl;
        });
        Object.keys(byModule).forEach(function(rm){
          var master=masterByModule[rm]; if(!master) return;
          var kids=byModule[rm].filter(function(k){ return k.id!==master.id; });
          if(!kids.length) return;
          masterChildren[master.id]=kids;
          kids.forEach(function(kid){
            (childMasters[kid.id]=childMasters[kid.id]||[]);
            if(childMasters[kid.id].indexOf(master)<0) childMasters[kid.id].push(master);
          });
        });
      }
      /* resmodule 没有识别出任何主从时（如 md_table 主表标记未读到），回退到表名约定 <base>_b */
      if(Object.keys(masterChildren).length===0){
        var tblClassMap = Object.create(null);
        allClasses.forEach(function(cl){ var t=((cl.tableName)||'').toLowerCase(); if(t){ (tblClassMap[t]=tblClassMap[t]||[]).push(cl); } });
        allClasses.forEach(function(cl){
          var t=((cl.tableName)||'').toLowerCase(); if(!t) return;
          var base = t.endsWith('_h') ? t.slice(0,-2) : t;
          var kids=(tblClassMap[base+'_b']||[]);
          if(!kids.length) return;
          (masterChildren[cl.id]=masterChildren[cl.id]||[]);
          kids.forEach(function(kid){ if(kid.id!==cl.id && masterChildren[cl.id].indexOf(kid)<0) masterChildren[cl.id].push(kid); });
          if(!masterChildren[cl.id].length) delete masterChildren[cl.id];
          kids.forEach(function(kid){
            (childMasters[kid.id]=childMasters[kid.id]||[]);
            if(childMasters[kid.id].indexOf(cl)<0) childMasters[kid.id].push(cl);
          });
        });
      }
    }
  }
  rebuildIndexes();
  function findClassById(id){ return classIndex[id] || null; }

  /* ---------- 表格列 / 行 ---------- */
  function enterHead(){ var h=[]; if(colState.name)h.push('属性编码'); if(colState.dname)h.push('属性名称'); if(colState.field)h.push('字段编码'); if(colState.type)h.push('数据类型'); if(colState.len)h.push('长度'); if(colState.key)h.push('主键'); if(colState.nullable)h.push('可空'); if(colState.def)h.push('默认值'); if(colState.ref)h.push('引用模型'); if(colState.desc)h.push('备注 / 枚举'); return h; }
  function enterRow(p){
    var cells=[];
    var td=function(html,mono){ cells.push(mono?'<td class="mono">'+html+'</td>':'<td>'+html+'</td>'); };
    if(colState.name) td(esc(p.name||''),true);
    if(colState.dname) td(esc(p.displayName||''));
    if(colState.field) td(esc(p.fieldType||''),true);
    if(colState.type){ var t=esc(p.typeName||'-'); if(p.enumValues&&p.enumValues.length){ var box=p.enumValues.map(function(ev){return '<span class="e">'+esc(ev.value)+'</span><span class="enm">='+esc(ev.name)+'</span>';}).join(''); t=t+'<div class="enumbox">'+box+'</div>'; } td('<span class="tbadge '+typeBadge(p.typeName)+'">'+t+'</span>'); }
    if(colState.len) td(esc(p.attrLength||''));
    if(colState.key) td(p.isKey?'<span class="pkstar">PK</span>':'-');
    if(colState.nullable) td(esc(p.nullable)&&String(p.nullable).toLowerCase()!=='false'&&String(p.nullable).toLowerCase()!=='no'&&String(p.nullable)!=='N'?( '<span class="null-flag">'+esc(p.nullable)+'</span>'):'否');
    if(colState.def) td(esc(p.defaultValue));
    if(colState.ref){ var r=esc(p.refDesc||''); if(p.refId && classIndex[p.refId]){ r='<a href="javascript:void(0)" class="ref-link" data-id="'+esc(p.refId)+'" title="点击查看引用实体字段">'+r+' &#9654;</a>'; } td(r); }
    if(colState.desc) td(esc(p.description));

  function makePropTable(cl){
    var table=document.createElement('table'); table.className='grid';

    if(!tbody.children.length) tbody.innerHTML='<tr><td colspan="'+enterHead().length+'" class="empty">无字段</td></tr>';
    table.appendChild(thead); table.appendChild(tbody);
    return table;
  }

  /* ============================================================
     左侧树：懒渲染。只有展开的模块/组件才创建其子节点，
     避免一次性生成 4121 个导航节点占内存 / 卡顿。
     ============================================================ */
  function buildNicelConfTree(){
    nav.innerHTML='';
    var frag=document.createDocumentFragment();
    (agg.modules||[]).forEach(function(m,mi){
      frag.appendChild(makeMod(m,mi));
    });
    nav.appendChild(frag);
    if(!(agg.modules||[]).length){ nav.innerHTML='<div class="nav-empty">未读取到元数据</div>'; }

  function makeMod(m,mi){
    var li=document.createElement('li'); li.className='mod';
    var mt=document.createElement('div'); mt.className='mt';
    mt.innerHTML='<span class="chester">&#9654;</span><span class="tname">'+esc(m.displayname||m.name)+'</span><span class="tcnt">'+moduleStats(m).c+'</span>';
    var ulComps=document.createElement('ul'); ulComps.className='comps';
    mt.addEventListener('click',function(e){
      e.stopPropagation();
      if(li.classList.contains('open')){ li.classList.remove('open'); return; }
      if(!ulComps._loaded){
        ulComps._loaded=true;
        if(!m.comps){
          /* 分片模式：展开即拉取该模块的数据文件 */
          li.classList.add('loading');
          toast('正在加载「'+(m.displayname||m.name)+'」数据…');
          loadMod(mi,function(){
            li.classList.remove('loading');
            buildCompsInto(ulComps,agg.modules[mi]||m,mi);
          });
        } else {
          buildCompsInto(ulComps,m,mi);
        }
      }
      li.classList.add('open');
    });
    li.appendChild(mt); li.appendChild(ulComps);
    return li;
  }
  function makeComp(c,mi,ci){
    var li=document.createElement('li'); li.className='comp';
    var ct=document.createElement('div'); ct.className='ct';
    ct.innerHTML='<span class="cname">'+esc(c.displayname||c.name)+'</span><span class="ecnt">'+(c.classes||[]).length+'</span>';
    var ulClss=document.createElement('ul'); ulClss.className='clss';
    ct.addEventListener('click',function(e){

  function makeCl(cl,mi,ci,ei){
    var li=document.createElement('li'); li.className='cls';

    var hasPk=(cl.props||[]).some(function(p){return p.isKey;});

  function buildCompsInto(ulComps,m,mi){ var frag=document.createDocumentFragment(); (m.comps||[]).forEach(function(c,ci){ frag.appendChild(makeComp(c,mi,ci)); }); ulComps.appendChild(frag); }
  function buildClssInto(ulClss,c,mi,ci){ var frag=document.createDocumentFragment(); (c.classes||[]).forEach(function(cl,ei){ frag.appendChild(makeCl(cl,mi,ci,ei)); }); ulClss.appendChild(frag); }

  /* ============================================================
     标签页：点击实体打开，只渲染这一个实体的字段表（省内存）
     ============================================================ */
  function openEntityTabByKey(id){
    var cl=findClassById(id);
    if(!cl){
      /* 分片模式：目标实体所在模块可能还没加载 —— 全量补齐后再找一次 */
      if(_needAll()){ toast('正在加载全部数据…'); ensureAllModules(function(){ openEntityTabByKey(id); }); return; }
      toast('未找到该实体'); return;
    }
    var key='tab-'+id;
    if(openTabKeys[key]){ setActiveTab(key); return; }
    openTabKeys[key]=true; openTabs.push(key);
    var item=document.createElement('div'); item.className='tab-item'; item.setAttribute('data-tab',key);
    item.innerHTML='<span class="tname">'+esc(cl.displayName||cl.name)+'</span><button class="x">&#10005;</button>';
    item.querySelector('.x').addEventListener('click',function(e){ e.stopPropagation(); closeTab(key); });
    item.addEventListener('click',function(){ setActiveTab(key); });
    tabBar.insertBefore(item, tabBar.querySelector('.tab-close')||null);
    setActiveTab(key);
  }
  function closeTab(key){ var i=openTabs.indexOf(key); if(i<0)return; openTabs.splice(i,1); delete openTabKeys[key]; var it=tabBar.querySelector('.tab-item[data-tab="'+key+'"]'); if(it)it.remove(); if(activeTab===key){ activeTab=null; if(openTabs.length){ setActiveTab(openTabs[openTabs.length-1]); } else { tabs.classList.remove('open'); syncEmptyOverlay(); } } }
  function setActiveTab(key){
    if(!openTabKeys[key]) return;
    activeTab=key;
    var items=tabBar.querySelectorAll('.tab-item'); for(var i=0;i<items.length;i++){ items[i].classList.toggle('active',items[i].getAttribute('data-tab')===key); }
    var cl=findClassById(key.replace('tab-',''));
    if(cl) renderTabBody(cl);
    tabs.classList.add('open');
    syncEmptyOverlay();
  }
  /* 实体的主从关系导航：主表（父）⇄ 子表（子）一键切换 —— 每个实体都常驻显示 */
  function relLink(id,label,sub,icon){
    var cl=classIndex[id];
    var nm=esc(cl? (cl.displayName||cl.name) : (label||''));
    return '<a href="javascript:void(0)" class="rel-link" data-id="'+esc(id)+'" title="点击切换跳转">'
      +(icon?'<b class="arr">'+icon+'</b>':'')+nm
      +(sub?' <span class="rel-sub">'+esc(sub)+'</span>':'')+'</a>';
  }
  function makeRelPanel(cl){
    /* 主表 → 子表：本实体是主表，其 <base>_b 表为子表 */
    var kids=masterChildren[cl.id]||[];
    /* 子表 → 主表：本实体是子表（<base>_b），其 <base> / <base>_h 为主表 */
    var parents=childMasters[cl.id]||[];
    var cap='主从关系导航';
    var icon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
    var html='<div class="relpanel"><div class="relpanel-head"><span class="rel-cap">'+icon+'<span>'+cap+'</span></span></div><div class="relpanel-body">';
    if(kids.length){
      html+='<div class="rel-sec"><span class="rel-tag rt-child">子表('+kids.length+')</span><span class="rel-items">'+
        kids.map(function(k){ return relLink(k.id, null, k.tableName?('表 '+k.tableName):k.name, '→'); }).join('')+
        '</span></div>';
    }
    if(parents.length){
      html+='<div class="rel-sec"><span class="rel-tag rt-parent">主表 / 父表('+parents.length+')</span><span class="rel-items">'+
        parents.map(function(pr){ return relLink(pr.id, null, pr.tableName?('表 '+pr.tableName):pr.name, '←'); }).join('')+
        '</span></div>';
    }
    if(!kids.length && !parents.length){
      html+='<div class="rel-sec"><span class="rel-tag rt-none">主从关系</span><span class="rel-empty">此实体既不是主表，也不是子表，<span class="hint">在左侧列表点选其他实体查看</span></span></div>';
    }
    html+='</div></div>';
    return html;
  }
  function renderTabBody(cl){
    var fullName=cl.aggFullClassName||cl.fullClassName||'';
    var h='<div class="tab-inner"><span class="tclass">'+esc(cl.displayName||cl.name)+'</span>'+
      (cl.name?'<span class="tchip mono">'+esc(cl.name)+'</span>':'')+
      (cl.tableName?'<span class="tchip tbl">表 '+esc(cl.tableName)+'</span>':'')+
      (cl.componentId?'<span class="tchip">组件 '+esc(cl.componentId)+'</span>':'')+
      funcChips(cl)+
      (fullName?'<span class="tchip">'+esc(fullName)+'</span>':'')+
      (classTypeName(cl.classType)?'<span class="tchip">'+esc(classTypeName(cl.classType))+'</span>':'')+
      '</div>';
    tabBody.innerHTML=h;
    // 主从关系导航（常驻）：主表 ⇄ 子表 一键切换
    tabBody.insertAdjacentHTML('beforeend', makeRelPanel(cl));
    // 枚举类没有字段表表，展示其枚举值
    if(cl.classType===203 && !(cl.props&&cl.props.length) && enumIndex[cl.id]){
      var ev=enumIndex[cl.id];
      var tb=document.createElement('table'); tb.className='grid';
      tb.innerHTML='<thead><tr><th>值</th><th>名称</th></tr></thead><tbody>'+
        ev.map(function(v){ return '<tr><td class="mono">'+esc(v.value)+'</td><td>'+esc(v.name)+'</td></tr>'; }).join('')+
        '</tbody>';
      tabBody.appendChild(tb);
      return;
    }
    var table=makePropTable(cl);
    tabBody.appendChild(table);
  }

  /* ============================================================
     全局搜索（数据驱动）：只挑命中的实体，点开即打开标签页
     ============================================================ */
  function entMatchStr(cl){
    var s=[cl.displayName,cl.name,cl.tableName].join(' ').toLowerCase();
    return s;
  }
  function applyGlobalSearch(){
    var q=inputQ.value.trim().toLowerCase();
    var box=$('searchResults');
    if(!q){ if(box){ box.classList.remove('show'); } resCount.classList.remove('show'); return; }
    if(_needAll()){ toast('正在加载全部数据…'); ensureAllModules(function(){ applyGlobalSearch(); }); return; }
    var hits=[];
    (agg.modules||[]).forEach(function(m){
      (m.comps||[]).forEach(function(c){
        (c.classes||[]).forEach(function(cl){
          if(entMatchStr(cl).indexOf(q)>-1){ hits.push(cl); }
          else if((cl.props||[]).some(function(p){ return (String(p.name||'')+' '+String(p.displayName||'')+' '+String(p.fieldType||'')+' '+String(p.typeName||'')+' '+String(p.description||'')).toLowerCase().indexOf(q)>-1; })){
            hits.push(cl);
          }
        });
      });
    });
    // 去重
    var seen={}, uniq=[]; hits.forEach(function(cl){ if(!seen[cl.id]){ seen[cl.id]=true; uniq.push(cl); } });
    renderSearchResults(uniq,q);
    resCount.textContent = '命中 '+uniq.length+' 个实体';
    resCount.classList.add('show');
  }
  function renderSearchResults(hits,q){
    var box=$('searchResults'); if(!box) return;
    box.innerHTML='';
    if(!hits.length){ box.innerHTML='<div class="sr-empty">未匹配到任何内容</div>'; box.classList.add('show'); return; }
    var ul=document.createElement('ul'); ul.className='sr-list';
    var cap = hits.length>300 ? 300 : hits.length;
    for(var i=0;i<cap;i++){
      var cl=hits[i];
      var li=document.createElement('li'); li.className='sr-item';
      var starred=(cl.props||[]).some(function(p){return p.isKey;});
      li.innerHTML='<span class="sr-pk">'+(starred?'&#9733;':'')+'</span><span class="sr-main">'+esc(cl.displayName||cl.name)+'</span>'+
        (cl.name?'<span class="sr-en">'+esc(cl.name)+'</span>':'')+
        (cl.tableName?'<span class="sr-tbl">'+esc(cl.tableName)+'</span>':'')+
        '<span class="sr-go">打开 &#9654;</span>';
      li.setAttribute('data-id', String(cl.id));
      (function(id){ li.addEventListener('click',function(){ closeSearchBox(); openEntityTabByKey(id); }); })(cl.id);
      ul.appendChild(li);
    }
    if(hits.length>cap){ var more=document.createElement('li'); more.className='sr-item sr-more'; more.textContent='... 仅显示前 '+cap+' 条，请细化关键词'; ul.appendChild(more); }
    box.appendChild(ul); box.classList.add('show');
  }
  function closeSearchBox(){ var b=$('searchResults'); if(b) b.classList.remove('show'); }

  /* ============================================================
     完整长页（打印用）：分批渲染，避免一次卡死。默认不渲染。
     ============================================================ */
  var longPageRunning=false, longPageTimer=null;
  function buildLongPage(){
    if(longPageRunning) return;
    if(_needAll()){
      toast('正在加载全部数据…'); closeSearchBox();
      content.innerHTML='<div class="empty">正在加载全部数据，请稍候…</div>';
      ensureAllModules(buildLongPage);
      return;
    }
    longPageRunning=true;
    closeSearchBox();
    content.innerHTML='<div class="empty" id="lpProgress">正在生成完整长页，请稍候…</div>';
    var mods=agg.modules||[];
    var mi=0;
    function step(){
      if(mi>=mods.length){ finishLongPage(); return; }
      var m=mods[mi];
      var sec=document.createElement('section'); sec.className='mod'; sec.setAttribute('data-lp','1');
      var t=document.createElement('div'); t.className='modtitle';
      t.innerHTML='<span class="nm">'+esc(m.displayname||m.name)+'<span class="en">'+esc(m.name||'')+'</span></span><span class="cnt">'+(m.comps||[]).length+' 组件 · '+((m.comps||[]).reduce(function(s,c){return s+(c.classes||[]).length;},0))+' 实体</span>';
      var comps=document.createElement('div'); comps.className='comps';
      (m.comps||[]).forEach(function(c,ci){
        comps.appendChild(makeLongComp(c,mi,ci));
      });
      sec.appendChild(t); sec.appendChild(comps);
      content.appendChild(sec);
      mi++;
      var p=$('lpProgress'); if(p) p.textContent='正在生成完整长页… '+mi+' / '+mods.length+' 模块';
      longPageTimer=setTimeout(step,0);
    }
    function finishLongPage(){
      var p=$('lpProgress'); if(p) p.remove();
      // 全部展开实体表格
      Array.prototype.forEach.call(content.querySelectorAll('.entwrap'),function(w){ w.style.display='block'; });
      longPageRunning=false; longPageTimer=null;
      toast('完整长页已生成，可打印');
    }
    step();
  }
  function clearLongPage(){ if(longPageTimer){ clearTimeout(longPageTimer); longPageTimer=null; } longPageRunning=false; content.innerHTML=''; showEmptyState(); }
  function makeLongComp(c,mi,ci){

  function makeLongEnt(cl,mi,ci,ei){
    var ent=document.createElement('div'); ent.className='entity'; ent.id='ent-'+mi+'-'+ci+'-'+ei;
    var head=document.createElement('div'); head.className='ehead';
    var chips=['<span class="ki pk">实体</span>'];
    if(cl.tableName) chips.push('<span class="ki tbl">表 '+esc(cl.tableName)+'</span>');
    var fullName = cl.aggFullClassName||cl.fullClassName||''; var klassHtml='';
    if(fullName){ klassHtml='<span class="klass" title="'+esc(fullName)+'">'+(prefs.fullClass?esc(fullName):'AGG '+esc(shortClass(fullName)))+'</span>'; }
    var extra = funcChips(cl);
    head.innerHTML=chips.join('')+extra+'<span class="dn">'+esc(cl.displayName||cl.name)+'<span class="en">'+esc(cl.name||'')+'</span></span>'+klassHtml;
    var openBtn=document.createElement('button'); openBtn.className='ui plain'; openBtn.style.cssText='margin:10px 16px;padding:6px 12px;font-size:12px'; openBtn.textContent='在新标签页打开';
    (function(id){ openBtn.addEventListener('click',function(e){ e.stopPropagation(); openEntityTabByKey(id); }); })(cl.id);
    ent.appendChild(head); ent.appendChild(makePropTable(cl)); ent.appendChild(openBtn);
    return ent;
  }
  function toggleComp(card){ var wrap=card.querySelector('.entwrap'); var on=wrap.style.display!=='none'; wrap.style.display=on?'none':'block'; card.querySelector('.compadjust').innerHTML=on?'展开 &#9660;':'收起 &#9650;'; }

  function showEmptyState(){
    var has=(agg.modules||[]).length>0;
    content.innerHTML='<div class="empty greet"><div class="g-ico">&#128218;</div><p>'+(has?'点击左侧目录或搜索，打开实体查看字段。':'未读取到元数据，请检查连接。')+'</p></div>';
  }
  /* 空态覆盖：打开标签页时遮住/清掉主区提示，关掉全部后恢复 */
  function syncEmptyOverlay(){
    if(openTabs.length>0){
      if(content.querySelector('.greet')) content.innerHTML='';
    } else if(!longPageRunning){
      if(!content.children.length) showEmptyState();
    }
  }

  /* ---------- 主内容默认：空态（省内存） ---------- */
  showEmptyState();
  buildNicelConfTree();

  /* ---------- 搜索框 ---------- */
  var searchDeb;
  inputQ.addEventListener('input',function(){ clearTimeout(searchDeb); searchDeb=setTimeout(applyGlobalSearch,200); });
  inputQ.addEventListener('keydown',function(e){ if(e.key==='Escape'){ inputQ.value=''; applyGlobalSearch(); inputQ.blur(); } if(e.key==='Enter'&&$('searchResults').classList.contains('show')){ var f=$('searchResults').querySelector('.sr-item'); if(f){ closeSearchBox(); openEntityTabByKey(f.getAttribute('data-id')||f.querySelector('.sr-en').textContent); } } });
  document.addEventListener('click',function(e){ if(e.target!==inputQ && e.target.closest && !e.target.closest('#searchResults')){ closeSearchBox(); } });
  // 字段引用穿透 + 主从关系跳转：点击“引用模型”或关系面板的链接跳到目标实体
  document.addEventListener('click',function(e){
    var rl=e.target.closest?e.target.closest('.ref-link,.rel-link'):null;
    if(rl){ e.preventDefault(); var id=rl.getAttribute('data-id'); if(id){ openEntityTabByKey(id); } }
  });

  /* ---------- 左侧树过滤（数据驱动，懒加载保持） ---------- */
  function applyNavFilter(){
    var q=navQ.value.trim().toLowerCase();
    if(!q){ if(navResult) navResult.remove(); $('nav').style.display=''; return; }
    if(_needAll()){ toast('正在加载全部数据…'); ensureAllModules(applyNavFilter); return; }
    // 清空重建整树最简单，但懒加载下会丢已展开状态。改用：数据驱动列出匹配模块/组件/实体（独立结果视图）。
    renderNavFilterResult(q);
  }
  var navResult;
  function clsHit(cl,q){
    if(!q) return true;
    if((cl.displayName||cl.name||'').toLowerCase().indexOf(q)>-1) return true;
    if((cl.tableName||'').toLowerCase().indexOf(q)>-1) return true;
    if((cl.name||'').toLowerCase().indexOf(q)>-1) return true;
    if((cl.fullClassName||cl.aggFullClassName||'').toLowerCase().indexOf(q)>-1) return true;
    return (cl.props||[]).some(function(p){ return (String(p.name||'')+' '+String(p.displayName||'')+' '+String(p.fieldType||'')+' '+String(p.typeName||'')+' '+String(p.description||'')).toLowerCase().indexOf(q)>-1; });
  }
  function renderNavFilterResult(q){
    if(!q){ if(navResult) navResult.remove(); $('nav').style.display=''; return; }
    if(!navResult){ navResult=document.createElement('div'); navResult.className='navtree'; navResult.id='navResult'; }
    navResult.innerHTML='';
    var mods=(agg.modules||[]);
    if(!mods.length){ navResult.innerHTML='<div class="nav-empty">未匹配到任何项</div>'; }
    var any=0;
    mods.forEach(function(m,mi){
      var modMatch=(m.displayname||m.name||'').toLowerCase().indexOf(q)>-1;
      var comps=[];
      (m.comps||[]).forEach(function(c,ci){
        var compMatch=(c.displayname||c.name||'').toLowerCase().indexOf(q)>-1;
        if(modMatch || compMatch){
          // 模块/组件名命中：秀出其全部下级（出现下级）
          var clsAll=[];
          (c.classes||[]).forEach(function(cl,ei){ clsAll.push({cl:cl,ci:ci,ei:ei}); });
          comps.push({c:c,ci:ci,cls:clsAll});
        } else {
          // 仅实体命中：只秀命中的实体
          var clsHitArr=[];
          (c.classes||[]).forEach(function(cl,ei){ if(clsHit(cl,q)) clsHitArr.push({cl:cl,ci:ci,ei:ei}); });
          if(clsHitArr.length) comps.push({c:c,ci:ci,cls:clsHitArr});
        }
      });
      if(!modMatch && !comps.length) return;
      any++;
      var ul=document.createElement('ul'); ul.className='navfilter-block';
      var modli=document.createElement('li'); modli.className='nf-mod';
      modli.innerHTML='<span class="nf-t">'+esc(m.displayname||m.name)+'</span>'+(modMatch?'<span class="nf-hit">命中</span>':'');
      ul.appendChild(modli);
      comps.forEach(function(CC){
        var cli=document.createElement('li'); cli.className='nf-comp';
        cli.innerHTML='<span class="nf-t">'+esc(CC.c.displayname||CC.c.name)+'</span>'+(CC.cls.length?'<span class="nf-ec">'+CC.cls.length+'</span>':'');
        if(CC.cls.length){
          var clsUl=document.createElement('ul');
          CC.cls.forEach(function(E){
            var cln=document.createElement('li'); cln.className='nf-cl';
            cln.innerHTML='<span class="sr-main">'+esc(E.cl.displayName||E.cl.name)+'</span>'+(E.cl.name?'<span class="sr-en">'+esc(E.cl.name)+'</span>':'')+(E.cl.tableName?'<span class="sr-tbl">'+esc(E.cl.tableName)+'</span>':'');
            (function(id){ cln.addEventListener('click',function(){ navQ.value=''; applyNavFilter(); openEntityTabByKey(id); }); })(E.cl.id);
            clsUl.appendChild(cln);
          });
          cli.appendChild(clsUl);
        }
        ul.appendChild(cli);
      });
      navResult.appendChild(ul);
    });
    if(!any){ navResult.innerHTML='<div class="nav-empty">未匹配到任何项</div>'; }
    var tree=$('nav'); tree.parentNode.insertBefore(navResult, tree.nextSibling); tree.style.display='none';
  }
  navQ.addEventListener('input',debounce(applyNavFilter,200));
  function debounce(fn,ms){ var t; return function(){ clearTimeout(t); var a=arguments,th=this; t=setTimeout(function(){fn.apply(th,a);},ms); }; }

  /* ---------- toolbar actions ---------- */
  $('btnExpand').onclick=buildLongPage;
  $('btnCollapse').onclick=clearLongPage;

  /* ---------- settings ---------- */
  $('btnSettings').onclick=function(){ drawer.classList.add('open'); scrim.classList.add('show'); syncSettingsUI(); };
  $('drClose').onclick=function(){ drawer.classList.remove('open'); scrim.classList.remove('show'); };
  scrim.onclick=function(){ drawer.classList.remove('open'); scrim.classList.remove('show'); };
  $('drDone').onclick=function(){ readSettings(); drawer.classList.remove('open'); scrim.classList.remove('show'); rerenderOpen(); toast('设置已应用'); };
  $('drReset').onclick=function(){ colState={name:true,dname:true,field:true,type:true,len:true,key:true,nullable:true,def:true,ref:true,desc:true}; prefs={keyOnly:false,fullClass:false,theme:'{{THEME}}'}; readSettings(); applyTheme('{{THEME}}'); drawer.classList.remove('open'); scrim.classList.remove('show'); rerenderOpen(); toast('已恢复默认'); };
  function rerenderOpen(){
    if(activeTab){ var cl=findClassById(activeTab.replace('tab-','')); if(cl) renderTabBody(cl); }
    // 若在长页视图，重绘长页
    var hasLP=content.querySelector('[data-lp="1"]'); if(hasLP){ buildLongPage(); }
  }
  function syncSettingsUI(){
    var map={ 'c-name':'name','c-dname':'dname','c-field':'field','c-type':'type','c-len':'len','c-key':'key','c-null':'nullable','c-def':'def','c-ref':'ref','c-desc':'desc' };
    for(var k in map){ $(k).checked = colState[map[k]]; }
    $('sw-keyonly').classList.toggle('on',prefs.keyOnly);
    $('sw-fullclass').classList.toggle('on',prefs.fullClass);
    var opts=document.querySelectorAll('#themeRow .theme-opt');
    for(var i=0;i<opts.length;i++){ opts[i].classList.toggle('active', opts[i].getAttribute('data-theme')===prefs.theme); }
  }
  function readSettings(){
    var map={ 'c-name':'name','c-dname':'dname','c-field':'field','c-type':'type','c-len':'len','c-key':'key','c-null':'nullable','c-def':'def','c-ref':'ref','c-desc':'desc' };
    for(var k in map){ colState[map[k]] = $(k).checked; }
    prefs.keyOnly = $('sw-keyonly').classList.contains('on');
    prefs.fullClass = $('sw-fullclass').classList.contains('on');
  }
  function makeSwitch(id,onchange){ var el=$(id); el.addEventListener('click',function(){ el.classList.toggle('on'); onchange(el.classList.contains('on')); }); }
  makeSwitch('sw-keyonly',function(v){ prefs.keyOnly=v; rerenderOpen(); });
  makeSwitch('sw-fullclass',function(v){ prefs.fullClass=v; rerenderOpen(); });
  /* 主题选择：点击即应用 */
  (function(){
    var opts=document.querySelectorAll('#themeRow .theme-opt');
    for(var i=0;i<opts.length;i++){
      (function(opt){ opt.addEventListener('click',function(){ applyTheme(opt.getAttribute('data-theme')); }); })(opts[i]);
    }
  })();
  applyTheme(prefs.theme);

  /* ---------- back to top ---------- */
  var toTop=$('toTop');
  window.addEventListener('scroll',function(){ toTop.classList.toggle('show',window.scrollY>400); },{passive:true});
  toTop.onclick=function(){ window.scrollTo({top:0,behavior:'smooth'}); };

  /* ---------- shortcut ---------- */
  document.addEventListener('keydown',function(e){
    var tag=(e.target.tagName||'').toLowerCase();
    if(e.key==='/' && tag!=='input' && tag!=='textarea'){ e.preventDefault(); inputQ.focus(); }
  });
})();

</script>
</body>
</html>
